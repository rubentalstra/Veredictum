#
# The operator compose file (#297): `docker compose up` starts the web console
# with no clone and no build. This file is attached to every release beside the
# binaries, and its image tag is held to the workspace engine version by
# scripts/release/check-console-pin.sh — the same one-value discipline as the
# console's crates.io pin, so a stale copy cannot ship with a cut.
#
#   curl -LO https://raw.githubusercontent.com/rubentalstra/Veredictum/main/docker/docker-compose.yml
#   docker compose up
#
# The console then serves on http://127.0.0.1:3210 (the container listens on
# 3000; the host side maps 3210 to stay clear of the dev servers that camp on
# 3000). It binds loopback ON PURPOSE: the console has no login, so exposing
# it wider is the operator's decision, behind their own gate.
#
# The image carries the console, the pinned engine AND the release's own
# catalogue and specification oracle (#420), so this works
# in an empty directory: what it grades against is the data of the release the
# image names, which is also what a record produced here can honestly cite.
#
# To use your own instead, bind-mount over the baked path — a bind mount
# obscures what the image has at the target
# (https://docs.docker.com/engine/storage/bind-mounts):
#
#   volumes:
#     - ./my-artifacts:/work/artifacts
#
# A run's artifacts stay inside the container, at `/work/out`, and a recreate
# forgets them: the console hands a finished run's record over HTTP, which is
# the path that does not depend on filesystem ownership. Mounting a host
# directory there works only if uid 65532 can write to it, since that is the
# uid the image runs as.
services:
  console:
    image: ghcr.io/rubentalstra/veredictum:0.1.4
    ports:
      - "127.0.0.1:3210:3000"
