[package]
name = "veredictum-console"
# Never published (`publish = false` below): the console ships only as an OCI
# image, and the image versions by the release tag rather than by this field.
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "The Veredictum web console: a Leptos SSR frontend over the published instrument (its own binary and OCI image; runs execute through the pinned veredictum CLI, never a fork of it)"
repository = "https://github.com/rubentalstra/Veredictum"
publish = false

# Full-stack Leptos crate (cargo-leptos): the rlib feeds the server binary
# (feature `ssr`) and the cdylib is the WASM client bundle (feature
# `hydrate`). NOTE: no openEHR spec governs a web console — our own design
# (#52); the wire the runs it orchestrates drive is spec-bound.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "veredictum-console"
path = "src/main.rs"

# The engine seam is deliberately absent from the scaffold: the console will
# depend on `veredictum` by exact version FROM crates.io (never `path =`) and
# spawn the same pinned binary for runs, which needs the first published
# release carrying the lib's pipeline API. Tracked as #54.
[dependencies]
# The engine, from crates.io BY EXACT VERSION — never `path =` (#52, #54):
# the console can only ever ship over a released instrument, so a console
# release is always reproducible by a third party from published artifacts.
# Server-only: the lib carries the blocking driver and its native deps, and
# nothing of it may enter the WASM bundle.
veredictum = { version = "=0.1.0-alpha.4", optional = true }

leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

# Pure-Rust SVG icons (no JS, both targets): the Lucide pack alone plus the
# leptos Icon component — the icondata umbrella crate pulls every pack and
# bloats the WASM binary (the FerroEHR lesson, #61's ratified stack).
leptos_icons = "0.7"
icondata_lu = "0.1"
icondata_core = "0.1"

# Isomorphic browser-API wrappers (the clipboard copy in the format_view
# kit). Its `ssr` feature MUST ride the ssr gate below or its browser
# primitives compile the wasm path into the native binary and panic at SSR
# (a lesson learned live in FerroEHR's console).
leptos-use = "0.19"

# The read seam's typed rows serialize across the server-fn wire on both
# targets.
serde = { version = "1", features = ["derive"] }

# server-only (behind `ssr`)
# The reachability probe's HTTP client — the ONE console-originated request
# to a CDR, the diagnostic carve-out the crate CLAUDE.md records. rustls,
# never native TLS, matching the engine's own pin.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
# `signal` carries the SIGTERM handler: the binary is PID 1 in the image, so
# graceful shutdown on `docker stop` is its own duty (src/main.rs).
tokio = { version = "1", features = ["rt-multi-thread", "signal"], optional = true }
# `anyhow` stays legal in binary entry points only, and the ssr main is one;
# library code returns typed `thiserror` errors.
anyhow = { version = "1", optional = true }

# browser-only (behind `hydrate`)
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]
ssr = [
    "dep:veredictum",
    "dep:reqwest",
    "leptos-use/ssr",
    "dep:serde_json",
    "dep:thiserror",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:anyhow",
]

[dev-dependencies]
# Scratch directories for the engine gate test's out trees and fixture ixit.
assert_fs = "1"
# The browser journeys (#69): a Rust-native WebDriver client over headless
# Chromium, never Playwright — the console admits no hand-written JavaScript,
# its test suite included. The gate reads the browser log through
# thirtyfour's legacy-log API. `tokio` repeats here
# for the `macros` feature the `#[tokio::test]` attribute needs; the ssr
# dependency above carries only what the server binary uses. Dev-only, so
# neither crate reaches the ssr binary or the hydrate bundle.
thirtyfour = "0.37.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

# cargo-leptos build config (Tailwind v4 standalone — no Node/npm anywhere in
# the build; pin the binary with LEPTOS_TAILWIND_VERSION in CI and containers).
[package.metadata.leptos]
output-name = "veredictum-console"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
# Static assets copied into the site root; seal.svg is a SYMLINK to the one
# brand original under assets/brand/, so the mark cannot fork.
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
