# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. `cargo deny check advisories` reads the same
# RustSec database `cargo audit` does and adds yanked, licenses, bans and
# sources, so no cargo-audit job exists and no second ignore list should either.
#
# WHY THIS FILE AND AN OSV-BASED SCANNER DISAGREE, and which one to believe.
# `Cargo.lock` records the union of every dependency any feature combination
# COULD pull. Scanners that read the lock file — OSV, and therefore the OpenSSF
# Scorecard `Vulnerabilities` check — report advisories for crates this feature
# set never compiles. cargo-deny resolves features and does not, so where the
# two disagree in that direction cargo-deny is the more precise instrument and
# this file needs no entry.
#
# In the OTHER direction — an advisory that DOES fire here and is ignored with
# an adjudication — the OSV-based scanners stay red anyway, because they read
# neither this file nor its reasoning. That visibility is a feature, not a false
# positive to silence: the public warning stands until the advisory is truly
# ELIMINATED from the graph, which is what every ignore's DELETING EVENT is for.
[advisories]
version = 2
# Fail on any RustSec advisory. Exceptions are explicit and dated.
yanked = "deny"
# EVERY ignore names the event that deletes it: adjudication is not
# elimination, so an ignore is a standing liability driven to zero and
# re-checked at every dependency-bump cycle.
ignore = [
  # 2026-08-26: Marvin attack timing sidechannel in `rsa`; no fixed release
  # exists upstream (0.9.10 is the latest). It reaches this graph through
  # `pgp` 0.20, which the instrument uses to VERIFY detached OpenPGP
  # signatures on version content (RM common master06 §Digital Signature) —
  # a verification-only path over public keys, holding no private key and
  # performing no decryption, so the sidechannel has no secret to leak here.
  # DELETING EVENT: the rsa 0.10 release, taken the day it ships.
  # https://rustsec.org/advisories/RUSTSEC-2023-0071
  { id = "RUSTSEC-2023-0071", reason = "reached only through pgp 0.20's signature VERIFICATION path: public keys only, no private key material and no decryption in this instrument" },
]

[licenses]
version = 2
# Permissive licenses compatible with an Apache-2.0 project.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  # MIT No Attribution.
  "MIT-0",
  # Community Data License Agreement — Permissive 2.0 (webpki-roots: the
  # Mozilla CA bundle data). Permissive, Apache-2.0-compatible.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Deny known-unmaintained or footgun crates here as they surface.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
