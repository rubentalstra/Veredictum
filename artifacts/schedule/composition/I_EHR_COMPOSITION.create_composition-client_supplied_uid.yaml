# A COMPOSITION create whose BODY carries a `uid`. The released create has no
# branch for it: composition_create declares 201/400/404/422, no conflict
# response, and no sentence about a body uid — while the CONTRIBUTION create
# states the rule for the same shape and the COMPOSITION UPDATE states a match
# rule against the URL's `uid_based_id`. Register AMB-226 carries the
# adjudication: server-minted identity wins and the body value does not
# survive.
#
# The ground is BASE architecture_overview master09-identification.adoc
# §Levels of Identification — top-level content structures "are uniquely
# identified by the association of the identifier of their containing
# `VERSIONED_OBJECT` and the identifier of their containing `VERSION` within
# the container", and the contained item's `uid` "is strongly recommended
# [to] be populated with a copy of the `OBJECT_VERSION_ID` from the containing
# `VERSION<X>` object". The value a client could supply is therefore the
# identifier of a version container that does not exist until this request
# creates one, so there is nothing for the client value to be the identifier
# OF.
#
# WHAT THIS CASE ASSERTS, and why each half is enforceable. Step 1: the create
# is accepted, because no released branch refuses it. Step 2: the VERSION
# envelope's own `uid` is the identifier the create's `ETag` named and is not
# the client's value — RM common master06 §change_control fixes the VERSION's
# uid as a mandatory OBJECT_VERSION_ID, so this assertion needs no optional
# field to be present. Step 3: the client's own identifier addresses nothing.
# The CONTAINED COMPOSITION's `uid` is deliberately not asserted: no released
# sentence requires it populated at all (LOCATABLE.uid is 0..1; the copy is a
# recommendation), which is register AMB-67's report-only boundary, and
# asserting it here would fail a server that omits it.
id: I_EHR_COMPOSITION.create_composition-client_supplied_uid
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-226]
test_purpose: >-
  A COMPOSITION create carrying a client-chosen uid succeeds, and the created
  version's identity is the server-minted OBJECT_VERSION_ID; the client's value
  does not survive and addresses nothing.
description: "COMPOSITION create with a client-supplied uid (server identity wins)"
spec_refs:
  - "BASE architecture_overview master09 §Levels of Identification"
  - "RM common §change_control (master06 §Version Identification)"
  - "RM common §locatable (uid 0..1)"
  - "ITS-REST overview Resources §Identifier types"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.client_uid]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.client_uid}" }
    expect: created                      # no released branch refuses a body uid on the create
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # the committed version's identity is the server's
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${version_uid}" }
      # the biting half: the fixture's own uid, which a honouring server would have kept
      - { assert: field, path: "uid/value", not_equals: "3b6c9f18-0000-4000-8000-0000000004c2::cnf.client.example.com::1" }
  - step: 3                              # the client's value addresses nothing
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "3b6c9f18-0000-4000-8000-0000000004c2" }
    expect: not_found
postconditions:
  - { assert: version, count: 1 }
