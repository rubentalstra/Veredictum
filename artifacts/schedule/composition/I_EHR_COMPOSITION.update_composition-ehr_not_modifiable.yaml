# The UPDATE half of the deactivated-EHR refusal. RM ehr master04-ehr_package.adoc
# §EHR Active Status scopes the flag to the CONTENTS, not to a method: "The
# `EHR_STATUS._is_modifiable_` attribute is used to indicate whether _the
# contents of an EHR_ are modifiable, and is set to `True` if the EHR is
# considered _active_. An EHR's 'contents' consist of everything other than the
# `EHR_STATUS` object, i.e. its Compositions (Versioned objects referred to by
# the `_compositions_` attribute), its hierarchical Folders …". RM
# UML/classes/ehr_status.adoc §Attributes states the permission itself: "True if
# the EHR, other than the EHR_STATUS object, is allowed to be written to." A new
# COMPOSITION version is a write to a Composition, so the PUT is refused for the
# same reason the POST is.
#
# SPEC SILENCE on the CODE, adjudicated as AMB-82 (fixed_handling): the ITS-REST
# docs text never mentions `is_modifiable` outside the EHR-creation defaults and
# `composition_update.yaml` declares no branch for a deactivated EHR. The
# register's fixed handling is 409, the row ITS-REST overview
# Requests_and_responses.md §HTTP status codes describes as "Indicates that the
# request could not be processed because it might generate a duplicate or a
# conflict".
#
# The create-side sibling is create_composition-ehr_not_modifiable; a server can
# easily gate the POST and leave the PUT open, which is why this is its own row.
# Step 5 keeps the refusal honest: the stored latest is still the step-1 content,
# so the refused PUT committed no second version.
id: I_EHR_COMPOSITION.update_composition-ehr_not_modifiable
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [CompositionOps]
exercises: [EhrStatus]
profiles: [CORE]
ambiguities: [AMB-82]
test_purpose: >-
  Updating a COMPOSITION in an EHR whose EHR_STATUS.is_modifiable is false is
  refused as a conflict with the EHR's deactivated state, and commits no new
  version.
description: "Update a COMPOSITION in a deactivated EHR"
spec_refs:
  - "RM ehr §EHR Active Status (master04 — is_modifiable scopes to Compositions and hierarchical Folders)"
  - "RM UML/classes/ehr_status §Attributes (is_modifiable — the write permission)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
  - "SM openehr_platform §I_EHR_STATUS.clear_ehr_modifiable"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_modifiable = true
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1                              # the COMPOSITION to update, committed while the EHR is still active
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_EHR_STATUS.get_ehr_status    # the payload the PUT modifies + the If-Match precondition
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 3                              # deactivate: is_modifiable -> false
    call: I_EHR_STATUS.clear_ehr_modifiable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 4                              # the precondition is CURRENT: only the deactivation refuses this PUT
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: conflict
  - step: 5                              # nothing was committed: the latest is still the step-1 content
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: >-
      The refused update committed nothing: the deactivated EHR still serves the
      first COMPOSITION version as its latest (verified by step 5)
  - { assert: version, count: 1 }
