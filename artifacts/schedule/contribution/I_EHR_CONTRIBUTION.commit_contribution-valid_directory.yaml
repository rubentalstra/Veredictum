# E.1 — commit a CONTRIBUTION creating the EHR directory (root FOLDER) on an EHR
# that has none. The commit is accepted and the EHR gains a directory.
#
# THE COMMITTED VERSION'S change_type IS NOT AUTHORED as a machine assert
# (register AMB-24): ITS-REST 1.1.0 surfaces no VERSIONED_FOLDER container.
# specifications/ehr.openapi.yaml carries /ehr/{ehr_id}/directory and
# /ehr/{ehr_id}/directory/{version_uid} and nothing versioned, and
# directory_get_by_version_id answers 200_FOLDER_retrieved.yaml, the FOLDER
# rather than an ORIGINAL_VERSION envelope, so no released read serves
# commit_audit. The directory read named below is what the wire discloses.
id: I_EHR_CONTRIBUTION.commit_contribution-valid_directory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION with a valid FOLDER and change_type = creation on an
  EHR without a directory succeeds and creates the directory.
description: "Commit CONTRIBUTION containing valid FOLDER"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-valid_directory"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
ambiguities: [AMB-24]
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
  # No `directory:` requirement — "The EHR doesn't have a directory (root FOLDER)".
data_sets: [cnf.folder.minimal]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.folder.minimal}", change_type: creation }
    expect: created
    capture:
      version_uids: created.version_uids[]
postconditions:
  - assert: state
    text: "The EHR has a new CONTRIBUTION and a directory (root FOLDER)."
    verified_by: I_EHR_DIRECTORY.get_directory-ehr_root_directory
