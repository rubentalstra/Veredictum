# E.4 — commit a CONTRIBUTION updating an existing EHR directory (change_type =
# modification): accepted; a new VERSION of the root FOLDER is created.
# NOTE: the directory modification targets the EHR's current directory VERSION
# in the member body (SM update_version.adoc: UPDATE_VERSION.preceding_version_uid;
# OAS UpdateVersion.preceding_version_uid), bound from the requires.directory
# provisioning's published ${directory_version_uid}.
#
# THE COMMITTED VERSION'S change_type IS NOT AUTHORED as a machine assert
# (register AMB-24): ITS-REST 1.1.0 surfaces no VERSIONED_FOLDER container.
# specifications/ehr.openapi.yaml carries /ehr/{ehr_id}/directory and
# /ehr/{ehr_id}/directory/{version_uid} and nothing versioned, and
# directory_get_by_version_id answers 200_FOLDER_retrieved.yaml, the FOLDER
# rather than an ORIGINAL_VERSION envelope, so no released read serves
# commit_audit. The version-addressed read named below is what the wire
# discloses.
id: I_EHR_CONTRIBUTION.commit_contribution-update_existing_directory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION with change_type = modification for an existing EHR
  directory succeeds and creates a new VERSION of the root FOLDER.
description: "Commit CONTRIBUTION updating an EHR directory"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-update_existing_directory"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
ambiguities: [AMB-24]
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.folder.minimal          # "The EHR has a directory (root FOLDER)"
data_sets: [cnf.folder.updated]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.folder.updated}"
          change_type: modification
          preceding_version_uid: "${directory_version_uid}"   # bound by the requires.directory provisioning
    expect: created
    capture:
      version_uids: created.version_uids[]
postconditions:
  - assert: state
    text: "The EHR has a new CONTRIBUTION and a new VERSION for the root FOLDER."
    verified_by: I_EHR_DIRECTORY.get_directory_at_version-directory_with_two_versions
