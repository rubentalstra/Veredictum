# The ADMIN gate's authentication half on the archive extension family.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrArchive CAPABILITY
# verdict only. The 401 mapping is UNIVERSAL (selectors.yaml
# universal_outcomes: unauthenticated -> 401, route-table-wide).
#
# Archiving is a lifecycle MOVE, so the refusal must land before any marker is
# written; the id named here belongs to a provisioned EHR precisely so the
# refusal cannot be mistaken for the not-found branch.
id: I_ADMIN_ARCHIVE.archive_ehrs-unauthenticated
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_ehrs
capabilities: [EhrArchive]
exercises: [AdminApi, AuthenticatedAccess]
profiles: [OPTIONS]
test_purpose: >-
  A request carrying no valid authentication is refused before an existing EHR
  is moved to archival storage.
description: "Unauthenticated EHR archiving is refused"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_ehrs"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 401 — unauthenticated)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — specifications/admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE), so the surface may still change; the release states the operation semantics this row asserts and no released sentence exempts a DEVELOPMENT-state specification from them"
requires: { ehr: { commits: any } }        # mints ${ehr_id} — a REAL target, so 401 cannot be a disguised 404
flow:
  - step: 1
    call: archive_ehrs
    on: unauthenticated
    with: { ehr_ids: ["${ehr_id}"] }
    expect: unauthenticated                # universal 401 (route-table-wide)
postconditions:
  - assert: state
    text: >-
      The named EHR is not archived. Archival is read-neutral by design (the
      archived object stays addressable), so no read discloses the marker and
      the refusal's no-write effect is not observable on the extension wire;
      the in-repository proof is the service-level assertion, and the wire-side
      proof that the object remains addressable is the -archive_twice sibling.
    verified_by: I_ADMIN_ARCHIVE.archive_ehrs-archive_twice
ambiguities: [AMB-33]
