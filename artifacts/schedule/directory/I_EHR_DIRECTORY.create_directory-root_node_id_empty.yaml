# THE UNCONDITIONAL NODE-ID INVARIANT on the directory-CREATE seam: RM common
# UML/classes/locatable.adoc §Invariants states
# `Archetype_node_id_valid: not archetype_node_id.is_empty`, binding EVERY
# LOCATABLE with no root-point antecedent — so unlike the root-identity
# mismatch sibling, this refusal needs no archetype-root premise at all. The
# FOLDER converts (the one required member is present, well-typed, and empty
# is a legal JSON string), and fails the class invariant —
# `responses/422.yaml`'s "could be converted to a resource, but there are
# semantic validation errors" branch. The composition seam pins the same
# invariant BELOW the root (`-item_node_id_empty`); this case pins it on the
# directory root, where the sibling fixtures otherwise always carry the
# archetype-id form.
id: I_EHR_DIRECTORY.create_directory-root_node_id_empty
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a root FOLDER whose archetype_node_id is empty is
  rejected as a semantic error and no directory comes into existence, because
  Archetype_node_id_valid binds every LOCATABLE unconditionally.
description: "Create the directory from a FOLDER whose archetype_node_id is empty"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §locatable (Archetype_node_id_valid)"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.invalid.root_node_id_empty]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.invalid.root_node_id_empty}" }
    expect: validation_failed
  - step: 2                              # the refused create left no directory
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      No directory exists on the EHR: the refused create committed nothing
      (verified by step 2)
