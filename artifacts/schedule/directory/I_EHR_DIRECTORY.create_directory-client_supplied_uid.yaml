# A directory create whose BODY FOLDER carries a `uid`. The released create has
# no branch for it: directory_create declares 201/400/404, no conflict
# response, and its whole description is "Creates a new directory FOLDER
# associated with the EHR identified by `ehr_id`." — while the CONTRIBUTION
# create states the rule for the same shape and the COMPOSITION UPDATE states a
# match rule against the URL's `uid_based_id`. Register AMB-226 carries the
# adjudication: server-minted identity wins and the body value does not
# survive.
#
# The ground is BASE architecture_overview master09-identification.adoc
# §Levels of Identification — the contained top-level item's `uid` "is strongly
# recommended [to] be populated with a copy of the `OBJECT_VERSION_ID` from the
# containing `VERSION<X>` object" — so the value a client could supply names a
# version container that does not exist until this request creates one.
#
# WHAT THIS CASE ASSERTS. Step 1: the create is accepted, because no released
# branch refuses it. Step 2: the version the create's `ETag` named is served
# and carries the committed content, compared modulo the binding's
# server-assigned set. Step 3 is the biting half: the client's own identifier
# addresses no version of this EHR's directory, which a server that had
# honoured it would serve. ITS-REST 1.1.0 surfaces no versioned_directory
# endpoint (register AMB-24), so the FOLDER's VERSION envelope is unreachable
# on this ITS and the version identity is asserted through addressing instead.
# The served FOLDER's own `uid` is deliberately not asserted: no released
# sentence requires it populated at all (LOCATABLE.uid is 0..1; the copy is a
# recommendation), which is register AMB-67's report-only boundary.
id: I_EHR_DIRECTORY.create_directory-client_supplied_uid
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-226]
test_purpose: >-
  A directory create carrying a client-chosen uid succeeds, and the created
  version's identity is the server-minted OBJECT_VERSION_ID; the client's value
  does not survive and addresses nothing.
description: "Directory create with a client-supplied uid (server identity wins)"
spec_refs:
  - "BASE architecture_overview master09 §Levels of Identification"
  - "RM common §change_control (master06 §Version Identification)"
  - "RM common §locatable (uid 0..1)"
  - "ITS-REST overview Resources §Identifier types"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.client_uid]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.client_uid}" }
    expect: created                      # no released branch refuses a body uid on the create
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # the version the ETag named is the one that exists
    call: get_directory_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.client_uid}", ignoring: server_assigned }
  - step: 3                              # the client's value addresses nothing
    call: get_directory_at_version
    with:
      ehr_id: "${ehr_id}"
      version_uid: "3b6c9f18-0000-4000-8000-0000000004c4::cnf.client.example.com::1"
    expect: version_not_found
