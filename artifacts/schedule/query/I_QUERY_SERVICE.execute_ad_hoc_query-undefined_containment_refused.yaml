# The refusing branch of register AMB-220 (option_select, upstream #161): no
# released sentence assigns a behaviour to a containment pair the RM defines
# no relationship for. COMPOSITION CONTAINS COMPOSITION parses (the grammar
# accepts any identifier pair) and names only RM classes, so the 400_Query
# syntax trigger is never reached by the letter — the refusal is the party's
# declared branch, not a spec mandate. The empty-result twin is
# undefined_containment_empty. Under BOTH branches a non-empty result set is
# a wrong answer: the RM defines no pair the rows could denote.
id: I_QUERY_SERVICE.execute_ad_hoc_query-undefined_containment_refused
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
option: undefined-containment-refused    # AMB-220 option_select branch
test_purpose: >-
  A containment pair the RM defines no relationship for is refused as an
  invalid query on a SUT declaring the refusing branch — never answered with
  a non-empty result set.
description: "Undefined containment pair is refused (declared branch)"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Containment"
  - "ITS-REST query §400_Query"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # a loaded EHR, so acceptance would have rows to be wrong with
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c1/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS COMPOSITION c1 CONTAINS COMPOSITION c2
      fetch: 100                            # fetch always explicit
    expect: invalid_query
