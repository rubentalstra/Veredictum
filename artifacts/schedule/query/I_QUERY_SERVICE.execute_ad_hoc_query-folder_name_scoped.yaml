# The folder-scoped half of the pair case: constraining the FOLDER operand to
# one named folder narrows the pair set to that folder's references. The
# folder name is the WHERE predicate over f/name/value (QUERY AQL
# master03-syntax §Identified Paths, §WHERE) — the graph reading is AMB-218,
# the depth reading AMB-219. Folder f2 references exactly the
# multiply-classified composition 2, so the scoped query returns one row, and
# a server that scopes by EHR instead of by folder returns compositions f2
# never referenced.
id: I_QUERY_SERVICE.execute_ad_hoc_query-folder_name_scoped
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic, DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  A FOLDER CONTAINS COMPOSITION query scoped to one folder by name returns
  only that folder's referenced compositions.
description: "AQL folder containment scoped to one folder by name"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Containment"
  - "QUERY AQL master03-syntax §Identified Paths"
  - "RM common master05-directory_package §Overview"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # committed BEFORE the directory
  directory: cnf.directory.folder_containment_tree
data_sets: [cnf.directory.folder_containment_tree]
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS FOLDER f CONTAINS COMPOSITION c
        WHERE f/name/value = 'f2'
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: set                          # no ORDER BY: bag equality (QUERY master03 §ORDER BY)
        rows: { from: "${ds:cnf.directory.folder_containment_tree#f2_scoped_uids}" }
        columns: [{ name: uid }]
postconditions:
  - assert: state
    text: >-
      Folder scoping constrains the pair set to the named folder's references
      (AMB-218): one row, the composition f2 references.
