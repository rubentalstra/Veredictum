# The aggregates whose declared input type set is NOT numeric. QUERY AQL
# master03-syntax §MIN and §MAX both state "Input values type should be either
# String, Date, Time, Integer or Real, and it will also determine the return
# type", so a DV_DATE_TIME value and a DV_TEXT value are inside the declared
# set and the returned cell carries that same type back. §COUNT states "Input
# values type can be anything, while the return type is always an Integer",
# which is the third step: a String argument still counts as an Integer.
#
# The input values are exact, so every returned cell is a fact rather than a
# shape check: the digest-pinned recipe contract fixes composition k at event
# time 2026-01-01T0k:00:00Z and name "blood pressure k", so the edges of both
# ten-value sets are known outright.
#
# The DATE/TIME cell is judged as an INSTANT, not as bytes. ITS-REST
# Resources.md §Datetime format assigns the query path only a SHOULD —
# "Retrieval or querying those resources SHOULD return date, datetime, or time
# values in the (original) format provided by underlying backend engine,
# avoiding any format change" — so a served `+00:00` is the same fact as the
# committed `Z`: BASE iso8601_timezone.adoc §Description states "`Z` is a
# literal meaning UTC (modern replacement for GMT), i.e. timezone `+0000`".
# `cells: instant` gates on the instant and records the respelling. The
# unconditional preservation sentence one line above it governs the WRITE path
# and is tested there, by exact-lexeme rows.
#
# SUM and AVG are deliberately absent here: their declared input set is
# Integer or Real only, and the released text assigns no behaviour to an
# argument outside a function's declared set (register AMB-227, upstream #229).
# The twin cases aggregates_non_numeric_refused / aggregates_non_numeric_executed
# carry the two declared branches.
id: I_QUERY_SERVICE.execute_ad_hoc_query-aggregates_non_numeric
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  MIN and MAX return the edges of a non-numeric ordered input set — a
  DV_DATE_TIME value and a DV_TEXT value — in the input's own type, and COUNT
  returns an Integer over the same non-numeric argument.
description: "AQL MIN/MAX/COUNT over a non-numeric input value type"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Aggregate functions, §COUNT, §MIN, §MAX"
  - "QUERY AQL master03-syntax §Name alias"
  - "ITS-REST query §200_Query (RESULT_SET)"
  - "ITS-REST overview Resources.md §Datetime format (querying SHOULD return the backend's original format — the served spelling is not gating)"
  - "BASE UML/classes/iso8601_timezone.adoc §Description (`Z` is a literal meaning UTC, i.e. timezone `+0000`)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: event times 2026-01-01T00..09:00:00Z, names "blood pressure 0".."9"
flow:
  - step: 1                                 # Date/Time input: the edges are the first and last committed hour
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT
        MIN(c/context/start_time/value) AS mn,
        MAX(c/context/start_time/value) AS mx
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # a single aggregate row: order is determined
        cells: instant                      # Resources.md §Datetime format: the query-side spelling is a SHOULD
        columns: [{ name: mn }, { name: mx }]
        rows: [["2026-01-01T00:00:00Z", "2026-01-01T09:00:00Z"]]
  - step: 2                                 # String input: the edges of the ten distinct composition names
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT
        MIN(c/name/value) AS mn,
        MAX(c/name/value) AS mx
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
      fetch: 100
    expect: ok
    assert:
      - assert: result_set
        match: ordered
        columns: [{ name: mn }, { name: mx }]
        rows: [["blood pressure 0", "blood pressure 9"]]
  - step: 3                                 # "Input values type can be anything … the return type is always an Integer"
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT COUNT(c/name/value) AS n
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
      fetch: 100
    expect: ok
    assert:
      - assert: result_set
        match: ordered
        columns: [{ name: n }]
        rows: [[10]]
postconditions:
  - assert: state
    text: >-
      MIN and MAX are computed over the non-numeric input values the FROM
      clause selects and return the input's own type, and COUNT returns an
      Integer whatever the argument's type is.
