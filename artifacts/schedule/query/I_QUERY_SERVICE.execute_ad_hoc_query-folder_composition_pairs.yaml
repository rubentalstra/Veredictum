# The folder-containment pair set — the cartesian-product detector (#156).
# QUERY AQL master03-syntax §Containment defines CONTAINS as a parent/child
# constraint; the QUERY text never generalizes containment across
# versioned-object references and never mentions FOLDER, so the graph reading
# is pinned by register AMB-218 (fixed_handling, upstream #159) and the
# any-depth reading by AMB-219 (upstream #160). RM ehr master04 §Folders and
# RM common master05 §Overview define the folder→composition relationship as
# the items references, multiply-classifiable.
#
# The provisioned tree (cnf.directory.folder_containment_tree) references
# committed compositions 0..3 from folders f11/f1/f2 and leaves 4..9
# unreferenced, so the pair query has exactly 10 (folder, uid) rows. A server
# that ignores folder membership and pairs every composition with every
# folder — the FerroEHR#2880 defect this case exists to catch — returns 50
# rows and fails the set match on first contact.
id: I_QUERY_SERVICE.execute_ad_hoc_query-folder_composition_pairs
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic, DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  FOLDER CONTAINS COMPOSITION pairs exactly the folder-referenced
  compositions, transitively over the containment graph, with the
  multiply-classified composition once per containing folder — never the
  cartesian product of folders and compositions.
description: "AQL FOLDER CONTAINS COMPOSITION returns exactly the referenced pairs"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Containment"
  - "RM ehr master04-ehr_package §Folders"
  - "RM common master05-directory_package §Overview"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # committed BEFORE the directory
  directory: cnf.directory.folder_containment_tree
data_sets: [cnf.directory.folder_containment_tree]
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT f/name/value AS folder, c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS FOLDER f CONTAINS COMPOSITION c
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: set                          # no ORDER BY: bag equality (QUERY master03 §ORDER BY)
        rows: { from: "${ds:cnf.directory.folder_containment_tree#folder_composition_pairs}" }
        columns: [{ name: folder }, { name: uid }]
postconditions:
  - assert: state
    text: >-
      The containment constraint filtered by folder membership: 10 pair rows,
      the multiply-classified composition once per containing folder, the six
      unreferenced compositions absent (AMB-218/AMB-219).
