# The VIRTUAL workspace manifest (#55): no package lives at the repository
# root. Both products are crates under app/ — the instrument (the crates.io
# surface) and the web console (ships only as the OCI image). This file owns
# what only a workspace root can own: the member list, the shared lint tables
# every member inherits through `[lints] workspace = true`, and the profiles,
# which cargo honours at exactly one place
# (https://doc.rust-lang.org/cargo/reference/workspaces.html).

[workspace]
resolver = "3"
members = ["app/veredictum", "app/veredictum-console"]
# The instrument alone, so every documented `cargo run -- <subcommand>`
# invocation keeps working from the repository root — a virtual workspace
# with two default members cannot resolve a bare `cargo run`. The console is
# NOT skipped by the gates for it: every CI cargo command passes --workspace
# explicitly (ci.yml), which is the honest arrangement — the guarantee lives
# in the gate, not in a local default.
default-members = ["app/veredictum"]

# ─────────────────────────────────────────────────────────────────────────────
# PROFILES
# ─────────────────────────────────────────────────────────────────────────────

# Backtraces name a file:line for this crate's own code; dependency debuginfo
# is never read here and dominates the target tree's size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Integer overflow FAILS LOUDLY rather than wrapping into a wrong measured or
# judged value. An instrument that quietly reports a wrong number is worse than
# one that stops.
[profile.release]
overflow-checks = true
# `panic = "unwind"` is the Cargo default, pinned explicitly because a switch to
# `abort` would be untestable by construction: "tests … ignore the panic
# setting" (https://doc.rust-lang.org/cargo/reference/profiles.html#panic).
panic = "unwind"
# file:line backtraces in release panics; "line-tables-only" is the minimal
# debuginfo that produces them
# (https://doc.rust-lang.org/cargo/reference/profiles.html#debug). `strip` stays
# at its default "none": stripping symbols makes traces "incomprehensible"
# (rustc book, -Cstrip) — never enable it for size.
debug = "line-tables-only"

# The console's WASM client bundle, selected by cargo-leptos through the
# crate's `lib-profile-release` (size-optimized per the Leptos deployment
# guide, https://book.leptos.dev/deployment/binary_size.html). Tests never
# use this profile, and wasm32-unknown-unknown carries no unwinder, so
# `abort` here states what the target does anyway; the instrument's own
# release profile above stays `unwind` per `.claude/rules/reliability.md`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# ─────────────────────────────────────────────────────────────────────────────
# LINTS — defined once at the workspace, inherited by every member through
# `[lints] workspace = true`, so the console is held to the identical tables
# (https://doc.rust-lang.org/cargo/reference/workspaces.html#the-lints-table).
# ─────────────────────────────────────────────────────────────────────────────

[workspace.lints.clippy]
# Zero re-exports: every import names its defining module. This tree carries
# none, so the rule holds as a compile error for free.
pub_use = "deny"
# The reliability rule set (`.claude/rules/reliability.md`): deny-tier fails
# every local clippy, warn-tier still fails CI (`-D warnings`). Tests keep the
# `clippy.toml` `allow-*-in-tests` scoping. Groups stay at priority -1 so every
# individual lint below (priority 0) overrides them — machine-required by
# clippy::lint_groups_priority (correctness). Restriction lints are
# CHERRY-PICKED individually; the group is never enabled wholesale (official
# Clippy guidance, https://doc.rust-lang.org/clippy/lints.html).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# ── the panic family — closed completely ────────────────────────────────────
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"                      # recoverable = Result; a panic is never a designed outcome
unimplemented = "deny"
todo = "deny"
unreachable = "deny"                # unreachable!() is a panic; a "cannot happen" state gets a typed error
panic_in_result_fn = "deny"         # a fn returning Result must not panic/assert instead
missing_assert_message = "deny"     # production asserts carry a message (lint ignores test fns by design)
dbg_macro = "deny"
print_stdout = "deny"               # the library returns typed reports; the binary relaxes at its own root
print_stderr = "deny"
incompatible_msrv = "deny"          # MSRV 1.96 is a hard pin
unchecked_time_subtraction = "deny" # std::time::Duration::sub panics on negative durations; jiff is the safe alternative
as_conversions = "deny"             # `as` silently truncates; use TryFrom/TryInto

# ── no panicking indexing ───────────────────────────────────────────────────
indexing_slicing = "deny"
string_slice = "deny"               # UTF-8 boundaries panic; clinical text is multi-byte

# ── determinism (emitted schemas and rendered reports are byte-compared) ────
iter_over_hash_type = "deny"        # HashMap/HashSet iteration order is undefined

# ── silent-discard / silent-loss ─────────────────────────────────────────────
unused_result_ok = "deny"           # `.ok();` looks like a check but only silences #[must_use]
map_err_ignore = "warn"             # map_err(|_| …) throws away the cause

# ── numeric honesty (a silently wrong measurement is the worst outcome) ─────
float_cmp_const = "deny"            # pedantic float_cmp misses comparisons to consts
lossy_float_literal = "deny"
as_underscore = "deny"              # `as _` hides the target type of a cast
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"            # shifts mixed with masks — classic wrong-answer bug
suspicious_xor_used_as_pow = "deny" # `2 ^ 8` meaning "2 to the 8th"
integer_division = "warn"           # division discards the remainder — annotate intent

# ── the #[allow] escape hatch, machine-enforced ──────────────────────────────
allow_attributes_without_reason = "deny"  # every suppression carries reason = "…"
allow_attributes = "warn"                 # prefer #[expect]: stale suppressions self-report
                                          # (unfulfilled_lint_expectations); inner #![allow] exempt

# ── the SAFETY-comment convention (free under forbid(unsafe_code)) ───────────
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny" # `// SAFETY:` stays reserved for unsafe code
unnecessary_safety_doc = "deny"     # `# Safety` sections likewise

# ── process / IO / container hygiene ─────────────────────────────────────────
exit = "deny"                       # std::process::exit gives no troubleshooting path
verbose_file_reads = "deny"         # File::read_to_* → fs::read*
filetype_is_file = "deny"           # FileType::is_file is not a readability test
create_dir = "deny"                 # create_dir → create_dir_all
large_include_file = "deny"         # 1 MB cap
rc_buffer = "deny"                  # Rc<String>/Arc<Vec<T>> → Rc<str>/Arc<[T]>
rc_mutex = "deny"                   # Rc<Mutex<T>> is always the wrong shape
mem_forget = "deny"
pointer_format = "deny"             # no address leakage into logs/Debug output
empty_drop = "warn"
deref_by_slicing = "warn"
try_err = "warn"
clone_on_ref_ptr = "warn"           # Arc::clone(&x) makes pointer-only cloning explicit
cfg_not_test = "warn"               # code excluded from test builds is untested code
infinite_loop = "warn"              # an intentional infinite loop returns `!`
mixed_read_write_in_expression = "warn"
same_name_method = "warn"

# ── nursery cherry-picks (the group stays off — "buggy or need more work") ───
debug_assert_with_mut_call = "warn"   # a side-effecting debug_assert! vanishes in release
too_long_first_doc_paragraph = "warn" # RFC 1574 summary line: one short first sentence, blank
                                      # line, then detail (.claude/rules/comments.md)

# ── cargo group (not part of `all`) ──────────────────────────────────────────
wildcard_dependencies = "deny"
negative_feature_names = "deny"     # `no-foo` features invert additive semantics
redundant_feature_names = "deny"    # `use-x`/`with-x` placeholder words (C-FEATURE)

[workspace.lints.rust]
unsafe_code = "forbid"              # NOTE: forbid cannot be relaxed by attribute — not even
                                    # #[allow] compiles under it (rustc book, lint levels); a
                                    # need for unsafe would have to stop inheriting this table
                                    # entirely, which is a design decision, not an allow.
missing_debug_implementations = "warn"
missing_docs = "warn"               # every public item is documented (C-CRATE-DOC/C-DOC)
dead_code = "deny"                  # no dead code, ever — delete it or wire it
let_underscore_drop = "deny"        # `let _ = lock/tx;` drops the guard immediately
                                    # (must_use discards like `let _ = write!(String)` are the
                                    #  infallible-fmt idiom — NOT denied; the guard class above is)
let_underscore_lock = "deny"        # the same guard-drop, caught at the lock site
unreachable_pub = "warn"            # visibility is deliberate (CI-deny via -D warnings)
non_ascii_idents = "forbid"         # ASCII-only identifiers — no homoglyphs
                                    # (rustc book: the security rationale for this lint)

# free guards — zero findings expected; defence in depth
non_local_definitions = "deny"      # RFC 3373: an `impl` inside a fn body is visible OUTSIDE it,
                                    # so it reads as scoped and is not (warn-by-default since 1.83)
unexpected_cfgs = "deny"            # RFC 3013: a typo'd `cfg(feature = "…")` compiles the block
                                    # out silently
unsafe_op_in_unsafe_fn = "deny"     # moot under forbid(unsafe_code); costs nothing
ffi_unwind_calls = "deny"           # no FFI here; keeps it that way
deprecated_safe_2024 = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"

# real bug classes, low noise
unit_bindings = "warn"              # `let x = f();` where f returns () — a silent mistake
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"      # pairs with the zero-re-export import discipline
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "deny"  # `-x.pow(2)` reads wrong — numeric clarity
# NOTE: clippy::arithmetic_side_effects is deliberately NOT enabled —
# `overflow-checks = true` in [profile.release] already makes an overflow panic
# loudly (https://doc.rust-lang.org/cargo/reference/profiles.html#overflow-checks),
# and a blanket checked-math mandate invites the silent saturating dodges this
# table exists to prevent. It is a CLIPPY restriction lint, so a bare entry in
# this rust table would be inert and only emit a deprecated-lint-name warning.

[workspace.lints.rustdoc]
# Enforced by `cargo doc` under RUSTDOCFLAGS=-D warnings — the levels here apply
# to every doc run, local and CI
# (https://doc.rust-lang.org/rustdoc/lints.html).
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"   # a `should-panic` typo silently disables a doctest
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"
missing_crate_level_docs = "warn"       # the crate opens with //! docs (C-CRATE-DOC)
