# .github/actions/release-kind — is this a release, and is it a pre-release?
#
# ONE definition of the pre-release rule, for every step-level consumer. The
# rule itself: a `v*` tag with no `-` suffix is a release and moves the release
# pointers (`:latest`); a `v*` tag WITH a `-` suffix is a pre-release and moves
# none of them.
#
#   is-release     a `v*` tag with no `-` suffix
#   is-prerelease  a `v*` tag WITH a `-` suffix
#
# Neither is true when the ref is not a `v*` tag at all, so a caller can branch
# on one output alone.
#
# A workflow deciding in an EXPRESSION position that a step output cannot reach
# (a `jobs.<id>.if`, a `with:` on a job call) spells the rule inline and carries
# a comment pointing here. The image lane's tag policy is the one such site.
#
# A local action resolves against the runner's workspace rather than against the
# repository of the running workflow
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax),
# so the caller must have checked the repository out, and a lane that checks out
# a TAG reads this action from that tag's tree.
name: Classify the release kind
description: Decide whether this ref is a release tag and whether it is a pre-release.

inputs:
  tag:
    description: >-
      The tag to classify. Defaults to the pushed tag, which is empty when the
      ref is not a tag; a lane that resolves its tag from a dispatch input
      passes that resolved tag instead.
    required: false
    default: ""

outputs:
  is-release:
    description: '"true" for a `v*` tag with no pre-release suffix, else "false".'
    value: ${{ steps.kind.outputs.is-release }}
  is-prerelease:
    description: '"true" for a `v*` tag WITH a pre-release suffix, else "false".'
    value: ${{ steps.kind.outputs.is-prerelease }}
  tag:
    description: The tag that was classified, empty when the ref is not a tag.
    value: ${{ steps.kind.outputs.tag }}

runs:
  using: composite
  steps:
    - id: kind
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        tag="$INPUT_TAG"
        if [ -z "$tag" ] && [ "${REF#refs/tags/}" != "$REF" ]; then
          tag="$REF_NAME"
        fi
        is_release=false
        is_prerelease=false
        case "$tag" in
          v*-*) is_prerelease=true ;;
          v*)   is_release=true ;;
        esac
        {
          echo "tag=$tag"
          echo "is-release=$is_release"
          echo "is-prerelease=$is_prerelease"
        } >> "$GITHUB_OUTPUT"
        echo "tag '${tag}': release=${is_release} prerelease=${is_prerelease}"
