# Dependabot configuration.
# Options reference:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# THREE ecosystems: `github-actions`, `cargo` and `docker`. Each cooldown is
# reasoned from what a compromised release in that ecosystem could actually
# reach, which is why they differ.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A delay between a release being published and this bot proposing it, so a
    # compromised release has a window to be caught before it reaches a pull
    # request (the OWASP CI/CD Security Cheat Sheet's third-party-code control).
    # Three days: an action runs in CI but does not ship in a published
    # artifact, and actions here are digest-pinned, so a bump is a reviewed
    # change of digest.
    #
    # SECURITY updates are exempt by design — Dependabot applies no cooldown to
    # advisory-driven bumps, so an advisory still arrives immediately. That is
    # what makes a cooldown safe rather than a delay on getting fixes.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # One weekly pull request for every action bump. A single codeql-action
      # release otherwise opens three, one per sub-action, and a queue nobody
      # reads is not review. A breaking action major fails the lanes on that one
      # pull request, visibly.
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "ci" # plain conventional prefix; no attribution

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Seven days rather than the actions entry's three. A crate compiles INTO
    # the binary this project will publish, so a compromised release reaches
    # every downstream run rather than one CI job, and `Cargo.lock` means a bump
    # is a deliberate act with a wider blast radius. Security updates stay
    # exempt: Dependabot applies no cooldown to advisory-driven bumps, which is
    # what makes a cooldown safe rather than a delay on getting fixes.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps ride together — reviewing forty of them
      # individually is not review. A MAJOR stays on its own pull request,
      # because that is where a breaking change and its migration belong.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # `rand` is a dev-dependency for ONE purpose: handing `pgp`'s signing call
      # an RNG in the version-signature tests. The types have to unify with the
      # `rand_core` generation `pgp` itself uses, and `pgp 0.20` is on
      # `rand_core 0.6` — verified in the resolved graph, not from a comment:
      #
      #   $ cargo tree -i rand@0.8.8 --depth 1
      #   rand v0.8.8
      #   ├── num-bigint-dig v0.8.6
      #   └── pgp v0.20.0
      #
      # A major bump brings `rand_core 0.10`, which does not unify, and the test
      # stops compiling. `rand 0.10` is already in the graph for `uuid`, so both
      # majors coexist fine — the pin is on OUR dev-dependency alone.
      #
      # MAJOR versions only: patch and minor bumps within 0.8 are still wanted,
      # and a security advisory is exempt from `ignore` in neither direction —
      # Dependabot still opens advisory-driven pull requests. The entry lifts when
      # `pgp` moves to a newer `rand_core`, not before.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    # Fourteen days, the longest of the three. A base-image bump changes the
    # bytes every user of the published image runs, and both `FROM` lines are
    # digest-pinned — which is what makes an automated bump reviewable at all,
    # and also what means a bump nobody notices ships silently. Security updates
    # stay exempt: Dependabot applies no cooldown to advisory-driven bumps.
    #
    # Base-image CVEs do not depend on this lane either. The scheduled
    # `image-scan.yml` looks at the PUBLISHED image every Monday and files an
    # issue on a fixable finding, so a base advisory is caught whether or not a
    # newer tag exists to bump to.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
      include: "scope"
