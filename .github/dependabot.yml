# Dependabot configuration.
# Options reference:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# TWO ecosystems: `github-actions` and `cargo`. Each cooldown is reasoned from
# what a compromised release in that ecosystem could actually reach, which is
# why they differ. The `docker` ecosystem is absent because no Dockerfile exists
# yet: Dependabot resolves a manifest at the directory it is given, so an entry
# pointing at nothing is inert configuration that looks like a control. It lands
# with the container image (#12).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A delay between a release being published and this bot proposing it, so a
    # compromised release has a window to be caught before it reaches a pull
    # request (the OWASP CI/CD Security Cheat Sheet's third-party-code control).
    # Three days: an action runs in CI but does not ship in a published
    # artifact, and actions here are digest-pinned, so a bump is a reviewed
    # change of digest.
    #
    # SECURITY updates are exempt by design — Dependabot applies no cooldown to
    # advisory-driven bumps, so an advisory still arrives immediately. That is
    # what makes a cooldown safe rather than a delay on getting fixes.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # One weekly pull request for every action bump. A single codeql-action
      # release otherwise opens three, one per sub-action, and a queue nobody
      # reads is not review. A breaking action major fails the lanes on that one
      # pull request, visibly.
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "ci" # plain conventional prefix; no attribution

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Seven days rather than the actions entry's three. A crate compiles INTO
    # the binary this project will publish, so a compromised release reaches
    # every downstream run rather than one CI job, and `Cargo.lock` means a bump
    # is a deliberate act with a wider blast radius. Security updates stay
    # exempt: Dependabot applies no cooldown to advisory-driven bumps, which is
    # what makes a cooldown safe rather than a delay on getting fixes.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps ride together — reviewing forty of them
      # individually is not review. A MAJOR stays on its own pull request,
      # because that is where a breaking change and its migration belong.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
