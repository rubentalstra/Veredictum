# CodeQL — the security scanner over everything this repository executes: the
# instrument itself (`rust`) and the workflows that build it (`actions`).
#
# `build-mode: none` on both legs. For Rust that is CodeQL's own recommendation
# for a cargo project — the extractor reads the sources directly rather than
# observing a build, so the lane needs no toolchain, no target cache, and no
# second compile of a tree `ci.yml` already compiles four times.
#
# The shape is a hardened lane, not GitHub's starter template: every action
# pinned to a digest, per-job minimum permissions, concurrency, a timeout. Not a
# required check, so a skip can never block a merge.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - ".github/actions/**"
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
