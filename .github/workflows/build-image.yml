# The container build, as a REUSABLE workflow — the SLSA Build Level 3 lane for
# the image, mirroring release-build.yml for the binaries.
#
# WHY: SLSA Build L3 requires that the secret material authenticating the
# provenance "MUST NOT be accessible to the environment running the
# user-defined build steps"
# (https://slsa.dev/spec/v1.2/build-requirements §Provenance is Unforgeable).
# Building and attesting inside one ordinary job cannot satisfy that; moving
# BOTH into a reusable workflow does, per GitHub's documented construction
# (https://docs.github.com/actions/security-guides/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3;
# that page still says "SLSA v1.0" — the Build-track requirements are unchanged
# in v1.2). A caller passes the declared inputs below and nothing else, so no
# caller-defined step runs beside the attestation. The Fulcio certificate then
# names THIS workflow as the signer, which a consumer pins:
#
#   gh attestation verify oci://ghcr.io/rubentalstra/veredictum@<digest> \
#     -R rubentalstra/Veredictum \
#     --signer-workflow rubentalstra/Veredictum/.github/workflows/build-image.yml
#
# Every input is DATA — names, paths, label text — never executable content: an
# input carrying commands would hand the build definition back to the caller and
# dissolve the property this file exists for.
name: Build image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: The full image name to build and push (ghcr.io/…).
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile.
        required: true
        type: string
      context:
        description: The build context.
        required: false
        type: string
        default: .
      target:
        description: The Dockerfile target stage ('' = the final stage).
        required: false
        type: string
        default: ""
      defer-tags:
        description: >-
          Push by DIGEST only, applying no tags. The caller tags the digest
          itself (docker buildx imagetools create) once its own gates pass,
          using the computed list in the `tags` output — so a failed gate leaves
          nothing referencable.
        required: false
        type: boolean
        default: false
      binary-artifact-prefix:
        description: >-
          If set, download <prefix>-amd64 and <prefix>-arm64 run artifacts into
          bin/amd64 and bin/arm64 (the prebuilt-binary image pattern).
        required: false
        type: string
        default: ""
      labels:
        description: The per-image OCI labels (multiline, metadata-action syntax).
        required: true
        type: string
    outputs:
      digest:
        description: The pushed image index digest.
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: >-
          The newline-separated tag list the metadata step computed — what a
          defer-tags caller applies once its gates pass.
        value: ${{ jobs.build.outputs.tags }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore, for the signed attestation
      attestations: write # store it against this repository
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prebuilt inputs, when the caller's compile jobs produced them. Run
      # artifacts are shared across the run, so a called workflow reads them
      # directly (https://docs.github.com/actions/using-workflows/reusing-workflows).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.binary-artifact-prefix != ''
        with:
          name: ${{ inputs.binary-artifact-prefix }}-amd64
          path: bin/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.binary-artifact-prefix != ''
        with:
          name: ${{ inputs.binary-artifact-prefix }}-arm64
          path: bin/arm64

      # No QEMU input: the published target is COPY-only, so nothing foreign-arch
      # ever executes during the build. A lane that needs a RUN layer on the
      # non-native platform would have to add QEMU here deliberately.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER_METADATA_ANNOTATIONS_LEVELS is not cosmetic: GHCR reads the
      # package description from the INDEX annotation, and the action annotates
      # manifests only by default.
      #
      # The labels come from the caller; the TAG POLICY is fixed here so every
      # image tags identically by construction. `latest` is the RELEASE pointer,
      # so a pre-release tag must not move it — the rule's one definition lives
      # in .github/actions/release-kind, and it is spelled inline here because a
      # `with:` on an action cannot read a step output from the same job.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: ${{ inputs.labels }}

      # REVISION is the OCI-standard git-SHA arg
      # (org.opencontainers.image.revision); VERSION mirrors the tag policy.
      # Assembled in a step, values through env, so the with-block below stays a
      # plain reference.
      - name: Assemble build-args
        id: args
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo 'list<<EOF'
            echo "VERSION=${VERSION}"
            echo "REVISION=${REVISION}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # With defer-tags the push is BY DIGEST (type=image,push-by-digest): the
      # index lands in the registry untagged, and the caller applies the computed
      # tags only after its gates pass. Attestations bind the digest, so they are
      # identical either way.
      - name: Package and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.defer-tags }}
          outputs: ${{ inputs.defer-tags && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || '' }}
          # Inverted ternary on purpose: the truthy arm must be the non-empty
          # value, because a falsy '' true-arm would fall through to the tags.
          tags: ${{ !inputs.defer-tags && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ steps.args.outputs.list }}
          # Full provenance attestation
          # (https://docs.docker.com/build/metadata/attestations): SLSA v0.2
          # provenance plus an SPDX SBOM on the image index itself.
          provenance: mode=max
          sbom: true

      # The signed GitHub attestation binds the pushed digest to THIS workflow's
      # identity; push-to-registry makes it verifiable from the registry alone
      # (--bundle-from-oci) and enforceable at admission.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
