# SPDX-License-Identifier: Apache-2.0
#
# The ONE owner of hosted-console delivery (#348, #394): console.veredictum.eu.
#
# The instance is one machine that never stops, because a conformance run is a
# process that outlives the request that started it. #387 recorded what an
# autoscaling request platform did to that: several instances answered one
# service, so a poll reached one that never held the run and the page said "No
# run is in flight" about a run that was still executing, and an instance with
# no traffic for five minutes was terminated with the engine child inside it.
# `deploy/hosted/fly.toml` is the posture; this file is the only thing that
# applies it.
#
# What deploys is the published release image plus the committed data a
# volumeless instance needs (`deploy/hosted/Dockerfile`), so the hosted
# instrument runs the exact bytes a release published.
#
# Triggers:
#   - workflow_call from the release pipeline (release.yml), after the
#     scan-and-tag leg that applies the image tags. The build is
#     `FROM ghcr.io/rubentalstra/veredictum:latest`, which that leg moves on a
#     real release tag, so nothing is hand-bumped at a cut. The caller passes
#     `expected-version`, and it calls only for a real release: a pre-release
#     moves no `:latest`, so there is nothing to deploy.
#   - push to main touching the hosted posture (deploy/hosted/**): a posture
#     change redeploys the same release image with the new posture and the
#     current main's baked data.
#   - workflow_dispatch: a manual redeploy.
#
# Provisioning (owner action, once): create the Fly app, point
# console.veredictum.eu at it, and store a deploy token with
# `gh secret set FLY_API_TOKEN`. An empty secret is a hard failure here, never
# a skip: the job already runs only on the upstream repository, so a missing
# token is always a misconfiguration, and a green run must mean a deploy
# actually happened (the FerroEHR#2755 ruling).
#
# A failure here can never redden CI; when the release pipeline calls this
# workflow it reddens that pipeline's `announce` leg — which names the
# recovery — rather than anything the release already published.
name: Sandbox deploy

on:
  workflow_call:
    inputs:
      expected-version:
        description: >-
          The version string the hosted console must serve before the deploy
          counts as done (`X.Y.Z`, no `v`). Empty means "derive it from the
          `:latest` image's own version label" — which is what a posture push
          or a manual redeploy wants, since neither changes the image.
        required: false
        type: string
        default: ""
    secrets:
      FLY_API_TOKEN:
        description: A deploy token for the hosted-console app.
        required: true
  push:
    branches: [main]
    paths:
      - deploy/hosted/**
      - .dockerignore # it decides what the build below can even see
      - .github/workflows/sandbox-deploy.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: sandbox-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rubentalstra/veredictum
  SANDBOX_BASE: https://console.veredictum.eu

jobs:
  deploy:
    name: deploy the hosted instrument and verify
    # Upstream only: a fork has no token and no app.
    if: github.repository == 'rubentalstra/Veredictum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # The needs-edge's guarantee, re-asserted at the point of use (the
      # FerroEHR#2846 ruling): a release call means `:latest` must ALREADY be
      # the tag's image, because the hosted build is `FROM …:latest`. A stale
      # tag fails here, before any deploy — never as a 20-minute blind poll.
      # Anonymous registry reads: the image is public.
      - name: The :latest tag is the release image
        if: inputs.expected-version != ''
        env:
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | sed -nE 's/.*"token":"([^"]+)".*/\1/p')
          digest_of() {
            curl -fsS -o /dev/null -w '%{header_json}' \
              -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/$1" \
              | sed -nE 's/.*"docker-content-digest":\["([^"]+)"\].*/\1/p'
          }
          latest=$(digest_of latest)
          tagged=$(digest_of "$EXPECTED")
          if [ -z "$latest" ] || [ -z "$tagged" ] || [ "$latest" != "$tagged" ]; then
            echo "::error::${IMAGE}:latest (${latest:-unreadable}) is not the ${EXPECTED} image (${tagged:-unreadable}) — the deploy would ship the OLD release; the tag-apply leg must land first." >&2
            exit 1
          fi
          echo "${IMAGE}:latest == ${EXPECTED} (${latest})"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # One machine, and the deploy replaces it in place. The instance holds
      # nothing durable, so a redeploy costs the runs in flight and nothing
      # else — which is why no drain window is arranged here.
      - name: Deploy the hosted instrument
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is empty — create a deploy token for the hosted-console app and run: gh secret set FLY_API_TOKEN" >&2
            exit 1
          fi
          # The build context is the repository root, because the overlay
          # bakes the catalogue, the specs and the party declarations; the
          # config and the Dockerfile live together under deploy/hosted.
          flyctl deploy . \
            --remote-only \
            --config deploy/hosted/fly.toml \
            --dockerfile deploy/hosted/Dockerfile \
            --yes

      # The version poll IS the verification, and it stays whatever the host
      # is: what proves a deploy landed is the console serving the expected
      # engine, not a platform API agreeing that it deployed something.
      #
      # A bare 200 is NOT proof of the new deployment — the OLD one answers
      # 200 too (FerroEHR measured that twice, at 4.0.4 and 4.0.10). The
      # console's server-rendered shell footer carries `engine X.Y.Z`, and
      # the engine pin equals the console version by the check-console-pin
      # guard, so the served footer IS the deployed version. A release run is
      # told the version the tag names; every other run derives its
      # expectation from the `:latest` image's own version label, anonymously
      # — the deploy always builds FROM `:latest`, so what that image
      # declares is exactly what a successful promotion must serve.
      - name: Wait for the hosted console to serve the expected version
        env:
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          expected="${EXPECTED:-}"
          if [ -z "$expected" ]; then
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | sed -nE 's/.*"token":"([^"]+)".*/\1/p')
            idx=$(curl -fsS -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/latest")
            child=$(printf '%s' "$idx" | jq -r '[.manifests[] | select(.platform.os == "linux")][0].digest // empty')
            cfg=$(curl -fsS -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${child}" | jq -r '.config.digest // empty')
            expected=$(curl -fsSL -H "Authorization: Bearer ${tok}" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/blobs/${cfg}" \
              | jq -r '.config.Labels["org.opencontainers.image.version"] // empty')
            if [ -z "$expected" ]; then
              echo "::error::could not derive the expected version from :latest's org.opencontainers.image.version label — a verification that cannot decide must not pass (build-image.yml stamps the label, so an unreadable label is a registry/read defect to look at, not a shrug)." >&2
              exit 1
            fi
            echo "expectation derived from :latest — waiting for '${expected}'"
          fi
          deadline=$(( $(date +%s) + 1200 ))
          sleep 60
          while :; do
            body=$(curl -sS -m 30 "$SANDBOX_BASE/" || true)
            # `|| true` on the extraction too: under `set -e -o pipefail` a
            # no-match grep exits 1 and would kill the loop on its FIRST poll
            # (measured: run 33314783993 died on one DNS miss instead of
            # retrying to the deadline).
            served=$(printf '%s' "$body" | grep -oE 'engine [0-9][0-9A-Za-z.+-]*' | head -1 | cut -d' ' -f2 || true)
            if [ -n "$served" ] && [ "$served" = "$expected" ]; then
              echo "hosted console is serving engine ${served}"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the hosted console serves '${served:-nothing}' (expected '${expected}') 20 minutes after the deploy. The image side was proven correct beforehand (:latest == the release image), so the failing half is the deploy itself — read the machine's logs with 'flyctl logs -a veredictum-console'." >&2
              exit 1
            fi
            echo "hosted console serves '${served:-nothing}'; waiting for '${expected}'"
            sleep 20
          done
