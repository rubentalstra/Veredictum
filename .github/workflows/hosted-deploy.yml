#
# The MANUAL redeploy of console.veredictum.eu, the official conformance
# instrument (#388). Every step of the deploy lives in
# `.github/actions/hosted-deploy`, which `release.yml`'s `hosted` job calls too,
# so a manual redeploy and a release deploy run the identical steps (#449). Read
# that action for the posture, the one-image ruling (#420) and the deploy
# mechanics; this file is a trigger, an environment and a call.
#
# This workflow has no `workflow_call` trigger, and that is the whole point of
# #449: environment secrets are not available to a job inside a `workflow_call`
# workflow even when the job names the environment
# (https://github.com/actions/runner/issues/1490, closed as not planned), so the
# release pipeline calls the ACTION from an ordinary job of its own rather than
# calling this workflow.
#
# There is deliberately NO push trigger either. The posture files travel INSIDE
# the published image at /app/posture, and the one script the deploy key may run
# installs them out of the image it pulled (#423) — so a posture change reaches
# the box with the release that carries it. A push to `deploy/hosted/**`
# publishes no image, so a push-triggered run would go green having applied
# nothing, which is worse than no automation at all.
#
# Provisioning is #403, once: the box, the DNS, and a deploy key restricted to
# one command, stored in the `hosted` ENVIRONMENT rather than as repository
# secrets. An empty secret is a hard failure in the action rather than a skip —
# the job runs only on the upstream repository, so a missing key is always a
# misconfiguration, and a green run must mean a deploy actually happened (the
# FerroEHR#2755 ruling).
#
# A failure here can never redden CI.
name: Hosted deploy

on:
  workflow_dispatch:

permissions: {}

# One deploy at a time, whichever caller started it: `release.yml`'s `hosted`
# job names this same group, so a manual redeploy and a release deploy queue
# behind each other rather than racing for the box.
concurrency:
  group: hosted-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the hosted instrument and verify
    # Upstream only: a fork has no token and no app.
    if: github.repository == 'rubentalstra/Veredictum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy key and the host key are ENVIRONMENT secrets, not repository
    # ones, so they are reachable only from a job that names this environment —
    # and the environment's own protection rules are what stands in front of
    # them. This job reads them and passes them to the action as inputs, which
    # is the only way a composite action can receive a secret.
    environment: hosted
    # The checkout is all the token is for: the local action resolves against
    # the runner's workspace. The registry reads inside the action are
    # anonymous, and the deploy is one restricted command over SSH.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No expected version: a manual redeploy changes no image, so the action
      # derives what the console must serve from the `:latest` image's own
      # version label.
      - name: Deploy the hosted instrument
        uses: ./.github/actions/hosted-deploy
        with:
          ssh-key: ${{ secrets.HOSTED_SSH_KEY }}
          known-hosts: ${{ secrets.HOSTED_KNOWN_HOSTS }}
