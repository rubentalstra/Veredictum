#
# The ONE owner of hosted-console delivery (#348, #412): console.veredictum.eu,
# the official conformance instrument (#388).
#
# The instrument runs on a box this repository provisions, because a conformance
# run is a process that outlives the request that started it. #387 measured what
# an autoscaling request platform did to that: several instances answered one
# service, so a poll reached one that never held the run, and an instance with
# no traffic for five minutes was terminated with the engine child inside it.
# `deploy/hosted/` is the whole posture — the cloud-init, the compose file, the
# proxy — and this file is the only thing that applies it.
#
# TWO STAGES, because nothing on the box builds anything. The hosted image is
# the published release plus the data a volumeless instance needs, built and
# pushed HERE; the box only ever pulls. So a deploy is a pull and a recreate,
# and the box holds no checkout of this repository at all.
#
# The deploy itself is `rubentalstra/hetzner-deploy-action`, written for this and
# public because the gap was real: everything on the Marketplace either creates
# servers, runs self-hosted runners, or ends at `docker compose up -d` and calls
# that success. It waits for the container's own healthcheck and then fetches the
# public URL FROM THIS RUNNER, requiring the served engine version — because a
# bare 200 is not proof, the deployment being replaced answers 200 too.
#
# Triggers:
#   - workflow_call from the release pipeline (release.yml), after the
#     scan-and-tag leg that applies the image tags. The overlay is
#     `FROM ghcr.io/rubentalstra/veredictum:latest`, which that leg moves on a
#     real release tag, so nothing is hand-bumped at a cut. A pre-release moves
#     no `:latest`, so there is nothing to deploy.
#   - push to main touching the hosted posture (deploy/hosted/**): the same
#     release image is rebuilt with the new posture and the current main's data.
#   - workflow_dispatch: a manual redeploy.
#
# Provisioning is #403, once: the box, the DNS, and a deploy key restricted to
# one command. An empty secret is a hard failure here rather than a skip — the
# job runs only on the upstream repository, so a missing key is always a
# misconfiguration, and a green run must mean a deploy actually happened (the
# FerroEHR#2755 ruling).
#
# A failure here can never redden CI; called from the release pipeline it reddens
# that pipeline's `announce` leg, which names the recovery.
name: Hosted deploy

on:
  workflow_call:
    inputs:
      expected-version:
        description: >-
          The version string the hosted console must serve before the deploy
          counts as done (`X.Y.Z`, no `v`). Empty means "derive it from the
          `:latest` image's own version label" — which is what a posture push
          or a manual redeploy wants, since neither changes the image.
        required: false
        type: string
        default: ""
    secrets:
      HOSTED_SSH_KEY:
        description: The deploy key for the box, restricted to one command.
        required: true
      HOSTED_KNOWN_HOSTS:
        description: The box's host key, as ssh-keyscan prints it.
        required: true
  push:
    branches: [main]
    paths:
      - deploy/hosted/**
      - .dockerignore # it decides what the build below can even see
      - .github/workflows/hosted-deploy.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: hosted-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rubentalstra/veredictum
  HOSTED_IMAGE: ghcr.io/rubentalstra/veredictum-console-hosted
  HOSTED_BASE: https://console.veredictum.eu

jobs:
  deploy:
    name: deploy the hosted instrument and verify
    # Upstream only: a fork has no token and no app.
    if: github.repository == 'rubentalstra/Veredictum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The overlay is pushed to this repository's own registry namespace.
      packages: write
    steps:
      # The needs-edge's guarantee, re-asserted at the point of use (the
      # FerroEHR#2846 ruling): a release call means `:latest` must ALREADY be
      # the tag's image, because the hosted build is `FROM …:latest`. A stale
      # tag fails here, before any deploy — never as a 20-minute blind poll.
      # Anonymous registry reads: the image is public.
      - name: The :latest tag is the release image
        if: inputs.expected-version != ''
        env:
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | sed -nE 's/.*"token":"([^"]+)".*/\1/p')
          digest_of() {
            curl -fsS -o /dev/null -w '%{header_json}' \
              -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/$1" \
              | sed -nE 's/.*"docker-content-digest":\["([^"]+)"\].*/\1/p'
          }
          latest=$(digest_of latest)
          tagged=$(digest_of "$EXPECTED")
          if [ -z "$latest" ] || [ -z "$tagged" ] || [ "$latest" != "$tagged" ]; then
            echo "::error::${IMAGE}:latest (${latest:-unreadable}) is not the ${EXPECTED} image (${tagged:-unreadable}) — the deploy would ship the OLD release; the tag-apply leg must land first." >&2
            exit 1
          fi
          echo "${IMAGE}:latest == ${EXPECTED} (${latest})"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The box builds nothing, so the overlay is built here: the published
      # release image plus the catalogue, the specification oracle and the party
      # declarations a volumeless instance cannot mount.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the hosted image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/hosted/Dockerfile
          push: true
          # `:latest` is what the box's compose file pulls; the version tag is
          # what a reader traces a running instance back to.
          tags: |
            ${{ env.HOSTED_IMAGE }}:latest
            ${{ env.HOSTED_IMAGE }}:${{ inputs.expected-version || github.sha }}
          provenance: false

      # What the console must serve for this deploy to count. A release call is
      # told the version its tag names; a posture push or a manual redeploy
      # derives it from the `:latest` image's own version label, anonymously,
      # because the overlay is FROM that image and so what it declares is
      # exactly what a successful deploy must serve.
      #
      # The console's server-rendered footer carries `engine X.Y.Z`, and
      # check-console-pin holds that pin to the console version, so the footer
      # IS the deployed version. A bare 200 is never accepted as proof: the
      # deployment being replaced answers 200 too (FerroEHR measured that twice,
      # at 4.0.4 and 4.0.10).
      - name: What the console must serve
        id: expect
        env:
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          expected="${EXPECTED:-}"
          if [ -z "$expected" ]; then
            tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | sed -nE 's/.*"token":"([^"]+)".*/\1/p')
            idx=$(curl -fsS -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/latest")
            child=$(printf '%s' "$idx" | jq -r '[.manifests[] | select(.platform.os == "linux")][0].digest // empty')
            cfg=$(curl -fsS -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/${child}" | jq -r '.config.digest // empty')
            expected=$(curl -fsSL -H "Authorization: Bearer ${tok}" \
              "https://ghcr.io/v2/${IMAGE#ghcr.io/}/blobs/${cfg}" \
              | jq -r '.config.Labels["org.opencontainers.image.version"] // empty')
            if [ -z "$expected" ]; then
              echo "::error::could not derive the expected version from :latest's org.opencontainers.image.version label — a verification that cannot decide must not pass (build-image.yml stamps the label, so an unreadable one is a registry or read defect to look at, not a shrug)." >&2
              exit 1
            fi
            echo "expectation derived from :latest — waiting for '${expected}'"
          fi
          echo "version=${expected}" >> "$GITHUB_OUTPUT"

      # The deploy, and the proof. The action waits for the container's own
      # healthcheck, then fetches the public URL from THIS runner and requires
      # the served engine version — a bare 200 is not proof, because the
      # deployment being replaced answers 200 too.
      - name: Deploy to the box and verify it serves the release
        uses: rubentalstra/hetzner-deploy-action@23e875e1249a2fe2a27107291a638ab40da0172b # v1.0.1
        with:
          host: console.veredictum.eu
          user: deploy
          ssh-key: ${{ secrets.HOSTED_SSH_KEY }}
          known-hosts: ${{ secrets.HOSTED_KNOWN_HOSTS }}
          # One restricted command: the key on the box may run the deploy script
          # and nothing else, so the action issues exactly one command and that
          # command is the deploy.
          remote-command: deploy
          verify-url: ${{ env.HOSTED_BASE }}/
          verify-contains: engine ${{ steps.expect.outputs.version }}
          verify-timeout: "600"
