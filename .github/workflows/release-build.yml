# The release binary build, as a REUSABLE workflow — the SLSA Build Level 3 lane
# (SLSA v1.2; v1.0 is marked Retired on slsa.dev and the Build-track
# requirements are unchanged across the two).
#
# WHY THIS IS A SEPARATE FILE, which is the whole point of it. SLSA Build L3
# requires that the secret material authenticating the provenance "MUST NOT be
# accessible to the environment running the user-defined build steps"
# (https://slsa.dev/spec/v1.2/build-requirements §Provenance is Unforgeable).
# `actions/attest` inside an ordinary job does not satisfy that: every step of a
# job shares one runner VM, so a build step could in principle reach the signing
# material. That single clause is what separates Build L2 from Build L3 here.
#
# GitHub's documented remedy is to move the build AND its attestation into a
# reusable workflow, which runs on its own VM and whose steps a caller cannot
# add to — a caller passes declared inputs and nothing else
# (https://docs.github.com/actions/security-guides/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3;
# that page still says "SLSA v1.0" — the semantics match v1.2). The build
# definition therefore stops being caller-defined, and the Fulcio certificate
# names THIS workflow as the signer, which a consumer can require:
#
#   gh attestation verify veredictum-<tag>-<target>.tar.gz \
#     -R rubentalstra/Veredictum \
#     --signer-workflow rubentalstra/Veredictum/.github/workflows/release-build.yml
#
# That flag is the consumer-visible prize: a downstream verifier can insist an
# artifact came from this hardened lane rather than from any workflow that
# happens to live in this repository.
#
# WHAT IS NOT CLAIMED. The isolation is GitHub's, not ours, and this workflow's
# own steps run beside the attestation on the reusable workflow's VM. The claim
# is exactly what GitHub's construction supports — Build L3 by way of a
# non-caller-defined build definition and a signer identity a verifier can pin —
# and nothing about reproducibility or a hermetic build, which are separate SLSA
# tracks this repository does not address.
name: Release build (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag being built.
        required: true
        type: string
      sha:
        description: The commit the release was cut from.
        required: true
        type: string
      target:
        description: The Rust target triple.
        required: true
        type: string
      runner:
        description: The runner label matching the target's architecture.
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # A deliberately cold release build.
    timeout-minutes: 60
    permissions:
      contents: write # attach the per-arch tarball to the release
      id-token: write # Sigstore, for the provenance + SBOM attestations
      attestations: write # store them against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      # Cold by construction, not by hope: setup-rust-toolchain restores a
      # rust-cache entry unless told otherwise, so the published tarball would
      # otherwise be linked from bytes this job did not build. A publishing lane
      # restores no cache — nothing a prior run could have poisoned may
      # influence the artifact it signs.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      # `cargo auditable` embeds the compressed dependency list in the binary's
      # own `.dep-v0` linker section (under 4 KiB), so the SHIPPED artifact
      # self-describes to syft/trivy/grype/osv-scanner even when the release
      # page's SBOM never travelled with it
      # (https://github.com/rust-secure-code/cargo-auditable).
      - name: Install cargo-auditable
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-auditable@0.7.5
      - name: Build the instrument
        run: cargo auditable build --release --locked --bin veredictum
      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          out="veredictum-${TAG}-${TARGET}.tar.gz"
          strip target/release/veredictum
          tar -C target/release -czf "$out" veredictum
          echo "ASSET=$out" >> "$GITHUB_ENV"
          # A plain checksum beside the tarball. Everything else this lane
          # publishes needs `gh` or `cosign` installed and a network path to
          # Sigstore; this is the only verification available to an operator who
          # has neither — `sha256sum -c <file>.sha256sum` in a locked-down
          # environment, which is often exactly where a conformance run happens.
          #
          # It is NOT a signature and is not claimed as one: it detects a
          # corrupt or truncated download, not a substituted release. Only the
          # Sigstore bundle answers "who built this", and OpenSSF Scorecard
          # agrees — its signature probe matches `.asc`, `.minisig`, `.sig`,
          # `.sign`, `.sto` and `.sigstore.json`, and no checksum suffix
          # (v5.5.0 `probes/releasesAreSigned`).
          #
          # The file records the BARE filename, so `sha256sum -c` works in
          # whatever directory the downloader put the two files in.
          sha256sum "$out" > "${out}.sha256sum"
          cat "${out}.sha256sum"
          echo "CHECKSUM=${out}.sha256sum" >> "$GITHUB_ENV"

      # A CycloneDX SBOM of the Rust dependency graph — a different document
      # from the SPDX one BuildKit attaches to the image index, answering a
      # different question. The image SBOM sees the OS layer; this one
      # enumerates the cargo graph with `pkg:cargo/...` purls and the DIRECT
      # versus TRANSITIVE edges that make an SBOM actionable rather than a flat
      # package list (the OWASP Dependency Graph & SBOM Cheat Sheet's element
      # 8). Generated from the release commit's own `Cargo.lock`, so it
      # describes the graph that was actually built.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-cyclonedx
      - name: Generate the dependency SBOM
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # `--spec-version 1.5` is the HIGHEST cargo-cyclonedx emits: the flag
          # accepts 1.3, 1.4 or 1.5 and DEFAULTS to 1.3, so dropping it would
          # silently downgrade every release. CycloneDX 1.6 exists but this
          # generator cannot produce it; bump the moment it can. 1.5 carries
          # what makes the document actionable (purls, hashes, and the
          # direct-versus-transitive `dependencies` graph), and every consumer
          # that reads 1.6 reads 1.5.
          cargo cyclonedx --format json --describe binaries --spec-version 1.5
          # The generated filename follows the BINARY, and cargo-cyclonedx has
          # changed that spelling before — so the file is located rather than
          # assumed, and anything other than exactly one match is a failure
          # instead of a release shipping an SBOM named after the wrong thing.
          mapfile -t generated < <(find . -maxdepth 2 -name '*.cdx.json' -print | sort)
          if [ "${#generated[@]}" -ne 1 ]; then
            echo "::error::expected exactly one generated .cdx.json, found ${#generated[@]}: ${generated[*]-none}"
            exit 1
          fi
          sbom="veredictum-${TAG}-${TARGET}.cdx.json"
          mv "${generated[0]}" "$sbom"
          echo "SBOM=$sbom" >> "$GITHUB_ENV"

      # `actions/attest` is the one attestation action: the former
      # attest-build-provenance and attest-sbom are thin wrappers whose own
      # READMEs say new implementations should use it directly. No sbom or
      # predicate input means provenance mode; `sbom-path` means SBOM mode.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Attest the SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      # The attestations above live in GitHub's attestations API, which is what
      # `gh attestation verify` reads without a `--bundle` flag. Publishing them
      # as assets adds two things that API cannot: OFFLINE verification, and
      # visibility to scanners that read a release's file list rather than the
      # API (OpenSSF Scorecard's signed-releases probes match filename suffixes
      # — `.sigstore.json` for a signature, `.intoto.jsonl` for provenance;
      # v5.5.0 `probes/releasesAreSigned`, `probes/releasesHaveProvenance`).
      #
      # The `.intoto.jsonl` is a RE-CONTAINER, not a second document: the
      # bundle's `dsseEnvelope` is already a DSSE-wrapped in-toto Statement v1
      # whose `predicateType` is `https://slsa.dev/provenance/v1`, and
      # `.intoto.jsonl` means exactly one such envelope per line. Both
      # properties are asserted below rather than assumed, so a file that looks
      # like provenance and is not can never be attached.
      - name: Publish the attestations as release assets
        shell: bash
        env:
          ASSET_NAME: ${{ env.ASSET }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "${ASSET_NAME}.sigstore.json"
          cp "$SBOM_BUNDLE" "${ASSET_NAME}.sbom.sigstore.json"
          jq -c '.dsseEnvelope' "$PROVENANCE_BUNDLE" > "${ASSET_NAME}.intoto.jsonl"
          payload_type="$(jq -r '.payloadType' "${ASSET_NAME}.intoto.jsonl")"
          [ "$payload_type" = "application/vnd.in-toto+json" ] || {
            echo "::error::provenance envelope is not in-toto (payloadType=${payload_type})"
            exit 1
          }
          predicate="$(jq -r '.payload' "${ASSET_NAME}.intoto.jsonl" | base64 -d | jq -r '.predicateType')"
          [ "$predicate" = "https://slsa.dev/provenance/v1" ] || {
            echo "::error::provenance predicate is not SLSA v1 (${predicate})"
            exit 1
          }
          {
            echo "PROVENANCE_BUNDLE_ASSET=${ASSET_NAME}.sigstore.json"
            echo "SBOM_BUNDLE_ASSET=${ASSET_NAME}.sbom.sigstore.json"
            echo "PROVENANCE_JSONL_ASSET=${ASSET_NAME}.intoto.jsonl"
          } >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The release is still a DRAFT here and must stay one: the caller's
          # finalize job publishes it once every architecture has attached its
          # assets. Release immutability freezes a PUBLISHED release, so
          # flipping it here would lock the other architecture out.
          draft: true
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
            ${{ env.SBOM }}
            ${{ env.PROVENANCE_BUNDLE_ASSET }}
            ${{ env.SBOM_BUNDLE_ASSET }}
            ${{ env.PROVENANCE_JSONL_ASSET }}
