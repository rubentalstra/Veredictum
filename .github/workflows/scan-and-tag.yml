# The image vulnerability gate and the tag application, as a REUSABLE workflow.
#
# The ORDER is the whole point. The build pushes by digest (build-image.yml
# `defer-tags`), this workflow scans that digest, and only a passing scan makes
# it referencable. Tagging first and scanning second means a HIGH finding is
# already `:latest` by the time the lane turns red, and nothing about a red run
# un-publishes a tag people are pulling.
#
# The published index is dual-arch and Trivy reads ONE variant per invocation
# (`--platform`, default linux/amd64 — the Trivy container-image guide), so each
# variant is scanned explicitly. An image scanned on one architecture is an image
# whose other architecture was never looked at.
#
# It is a reusable workflow rather than two jobs in the caller so that the day a
# second lane needs the same gate, there is one implementation of it rather than
# two that drift.
name: Scan and tag image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: The image name (ghcr.io/…) whose pushed digest to scan and tag.
        required: true
        type: string
      digest:
        description: The pushed index digest.
        required: true
        type: string
      tags:
        description: The newline-separated tag list to apply once the scan passes.
        required: true
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  image-scan:
    name: image vulnerability scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the image the caller just pushed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ inputs.image }}@${{ inputs.digest }}
          scanners: vuln
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ${{ inputs.image }}@${{ inputs.digest }}
          scanners: vuln
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

  # Tags exist only AFTER the scan passes. `imagetools create` over a single
  # source re-tags the SAME digest, so the attestations bound to it stay valid.
  apply-tags:
    name: apply image tags (after the scan gate)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write # tag the digest the caller pushed
    needs: image-scan
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || {
            echo "::error::the caller passed no tags to apply"
            exit 1
          }
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          printf 'applied:\n%s\n' "$TAGS"
