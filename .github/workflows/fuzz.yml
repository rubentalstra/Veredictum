# .github/workflows/fuzz.yml
#
# The scheduled libFuzzer campaign over the readers that parse text or bytes
# this instrument did not write. The harnesses live in `fuzz/`; the discipline
# is `.claude/rules/fuzzing.md`.
#
# WHAT IS NOT HERE, deliberately: the build. Compiling the harnesses is the
# pull-request guard, and it lives in `ci.yml` as the `fuzz-build` job, because
# branch protection here requires only the `conclusion` check — a job in this
# workflow would run, go red, and gate nothing. A campaign on the pull-request
# path would be the slow job that gets disabled within a month.
#
# Each target keeps its corpus in the Actions cache between runs, so coverage
# accumulates instead of restarting from the seed set every week. A crash
# uploads its input as an artifact and fails the job; the fix belongs in the
# reader, pinned by a regression test, never by widening a bound here.
#
# cargo-fuzz needs nightly (libFuzzer wants `-Zsanitizer`), which is why `fuzz/`
# is its own workspace while this repository stays on pinned stable.
# Docs: https://rust-fuzz.github.io/book/cargo-fuzz.html
name: Fuzz

on:
  schedule:
    # Weekly, Monday 03:17 UTC. Off-the-hour to dodge the load spike every
    # cron-on-the-hour workflow on the platform contends for.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target (default 120)"
        required: false
        default: "120"

concurrency:
  # Never cancel a running campaign: a cancelled run loses the corpus it grew.
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# No permissions by default; the job grants itself the minimum it needs. Without
# this the workflow would inherit the repository default.
permissions: {}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # One failing target must not hide the other five.
      fail-fast: false
      matrix:
        include:
          # `max_len` bounds the inputs libFuzzer GENERATES, per target. A
          # reference or an identifier is a short string off a YAML line; a
          # citation is a sentence; an artifact is a whole document.
          - target: reference_grammar
            max_len: 256
          - target: literal_grammar
            max_len: 4096
          - target: citation
            max_len: 4096
          - target: artifact_yaml
            max_len: 16384
          - target: party_document
            max_len: 16384
          # An encoded histogram is a header plus a compressed payload; the
          # decoder refuses most of the space at the cookie, so a large input
          # only spends budget.
          - target: hdr_v2
            max_len: 4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          cache-workspaces: fuzz
          cache-key: ${{ matrix.target }}
          # This workflow runs only on `main` and on dispatch, so its cache
          # keys cannot be written by an untrusted pull-request run.
          cache-save-if: "true"

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # Not in install-action's managed manifest set, so this resolves
          # through its cargo-binstall fallback against the upstream release
          # assets.
          tool: cargo-fuzz@0.13.2

      - name: Restore the accumulated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # A run always saves under a fresh key and restores the newest prefix
          # match, which is how a cache entry keeps growing: GitHub cache
          # entries are immutable once written.
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Wire the seed corpus
        env:
          TARGET: ${{ matrix.target }}
        run: bash fuzz/seeds.sh "$TARGET"

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          MAX_LEN: ${{ matrix.max_len }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
        # The seed directory is passed as a SECOND corpus: libFuzzer writes only
        # to the first one, so the seeds and the recorded regressions linked
        # into them stay read-only inputs.
        #
        # `--target` is mandatory, for the reason `ci.yml`'s fuzz-build job
        # states: without it cargo-fuzz builds for its own musl triple, and a
        # static libc cannot carry a sanitizer.
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" \
            "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" \
            -- \
            -max_total_time="$SECONDS_PER_TARGET" \
            -max_len="$MAX_LEN" \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      - name: Upload the crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Save the accumulated corpus
        # Runs even when the target crashed: the corpus grown up to the crash is
        # the coverage the next run should start from.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
