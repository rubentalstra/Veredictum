# .github/workflows/publish-crates.yml
#
# Publishes `veredictum` to crates.io.
#
#   - Manual `workflow_dispatch` only, and it is the OUT-OF-BAND lane: the
#     ordinary path is the `publish-crate` leg of `release.yml`, which publishes
#     on the tag once the rest of the release has landed. This one exists for
#     the dry run and for recovery — a publish that has to happen without a new
#     tag. The upload itself is `scripts/release/publish-crate.sh`, the one
#     implementation both lanes call; each keeps its own JOB because crates.io
#     Trusted Publishing matches the OIDC `workflow_ref` claim, which for a job
#     inside a reusable workflow names the CALLING workflow
#     (https://docs.github.com/en/actions/concepts/security/openid-connect,
#     https://crates.io/docs/trusted-publishing). Sharing a reusable workflow
#     would present one identity for both lanes and only obscure which workflow
#     file the publisher configuration has to name.
#   - The default run is a DRY RUN (`cargo publish --dry-run` — package and
#     verify, no upload); a real publish needs the `publish` input set to `true`.
#   - Authentication is crates.io TRUSTED PUBLISHING (OIDC):
#     `rust-lang/crates-io-auth-action` exchanges this workflow's OIDC identity
#     for a 30-minute publish token, so no long-lived crates.io token exists in
#     this repository at all. The Trusted Publisher configured on crates.io
#     names this repository, THIS workflow file, and the `crates-io`
#     environment — rename any of the three and the exchange is refused.
#   - The crate's FIRST-ever release could not use OIDC: crates.io requires an
#     existing crate before a Trusted Publisher can be configured for it, so
#     `0.1.0-alpha.1` was pushed with a scoped token and the publisher was
#     configured afterwards. Every release from here runs through this lane.
#   - A published version is IMMUTABLE. It can be yanked, never replaced, so the
#     upload runs from this checkout with no build cache restored and the
#     registry is read back before the lane reports success.
name: Publish crate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish to crates.io (false = dry run)"
        required: false
        default: false
        type: boolean

# Two concurrent runs over the same version produce one success and one
# confusing failure, and the winner cannot be undone. Queue, never cancel.
concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  dry-run:
    name: dry run (package + verify, no upload)
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in a publishing lane, dry run included: the dry run's whole
      # value is verifying the same bytes the real publish would upload, and
      # setup-rust-toolchain caches by default.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      # This also proves the `include` allowlist in Cargo.toml is complete: the
      # packaged tree is compiled on its own, so a source directory the
      # allowlist forgot fails here rather than after an irreversible upload.
      - run: cargo publish --dry-run --locked

  publish:
    name: publish to crates.io
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The protected environment is part of the Trusted Publisher configuration
    # on crates.io. A publish attempted outside it is refused.
    environment: crates-io
    permissions:
      contents: read
      # OIDC token exchange (rust-lang/crates-io-auth-action).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in the lane that uploads: a published version is immutable, so
      # it is built from this checkout and nothing else.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crate.sh publish

      # The registry is the ground truth, not the exit code above. `always()`,
      # because this step matters most exactly when the publish step went red: a
      # run that uploaded successfully but misread its own output would otherwise
      # end red with nothing to contradict it.
      - name: Verify the version is on the registry
        if: always()
        run: bash scripts/release/publish-crate.sh verify
