# SonarQube Cloud analysis — a deterministic machine opinion beside the guard
# tier in ci.yml, under the standing law of `.claude/rules/ai-code-review.md`:
# findings are advisory, never outrank the released openEHR specification text,
# the hard rules, or the local gates, and gate no merge.
#
# WHAT IT READS. Rust first-party: the analyzer runs Clippy itself from the
# package manifest, with its own managed rule profile — a deliberately
# independent second Clippy configuration beside `ci.yml`'s deny-tier lanes,
# which for pure Rust mostly re-reports what those already enforce. Its added
# value is the multi-language sweep the Rust gates never see: the shell under
# `scripts/**` and `.claude/hooks/**`, the workflow YAML, the brand study's HTML
# and CSS, and secret detection across the tree. The shell coverage is a second
# opinion beside the shellcheck bundled in the actionlint image, not a
# replacement: shellcheck reads the shell embedded in workflow `run:` blocks,
# which is a set of files Sonar never sees as shell. Coverage rides this lane
# too (#9), through the `cargo-llvm-cov` steps below; the vendored trees are
# excluded in `sonar-project.properties`, because acting on a finding inside
# vendored bytes is forbidden here.
#
# CI-based analysis rather than Automatic Analysis, and that is a decision:
# Automatic Analysis would serve a YAML-and-HTML tree with no workflow at all,
# but it cannot analyze Rust, and the two modes are mutually exclusive per
# project, so this lane is the only mode that reads the Rust in this tree
# (https://docs.sonarsource.com/sonarqube-cloud/getting-started/github/).
#
# SONAR_HOST_URL is not set: it is not needed for SonarQube Cloud
# (SonarSource/sonarqube-scan-action README).
name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  scan:
    name: analyze
    # Analysis authenticates with SONAR_TOKEN, which a fork's pull request
    # cannot read. A run from a fork would fail on a missing secret rather than
    # report anything, so it is skipped and the guard tier in ci.yml — which
    # needs no secret — is what gates a fork's contribution. A Dependabot pull
    # request is skipped for the same reason: its runs read Dependabot secrets,
    # a separate store that SONAR_TOKEN is not in.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # pull-request decoration reads the PR metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar assigns issues and new-code status by blame.
          fetch-depth: 0
          persist-credentials: false

      # Coverage rides this lane rather than `ci.yml`: the scan is the only
      # consumer of the report, and an instrumented build is a second full
      # compile that nothing else needs. This lane publishes nothing, so
      # restoring a build cache is inside the reliability rule — only a
      # publishing lane must run cache-free. `cache-shared-key` keeps the
      # instrumented profile out of the plain CI cache.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
          cache-shared-key: sonar
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # The `ci` profile, so one run reports the whole failure surface rather
      # than stopping at the first failure. `--no-report` then `report` is the
      # documented two-step: it accumulates the profile and merges it into the
      # single lcov the scan imports through `sonar.rust.lcov.reportPaths`
      # (https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters).
      #
      # `--workspace` measures the console too (#119): without it the console
      # crate was neither covered nor counted, while the root manifest's
      # default-members note says every CI cargo command passes it explicitly.
      # `--features veredictum-console/ssr` is what compiles the console's
      # server-side tests, which is where its coverable code lives.
      #
      # `--workspace` also BUILDS the engine binary into this lane's own
      # target directory, which is what the console's engine, export, run and
      # scope gates spawn. They resolve it from the test executable's own
      # location rather than from a literal `target/debug/veredictum`, because
      # `cargo llvm-cov` redirects `CARGO_TARGET_DIR` and a literal path there
      # names either nothing (the gate skips, and the console under-reads) or a
      # stale binary from an older build (the gate grades yesterday's engine).
      #
      # THE COVERAGE DENOMINATOR, and what is deliberately outside it. The
      # exclusion list itself lives in `sonar-project.properties`, beside the
      # reason for each entry; this is the same adjudication stated where the
      # measurement is made, because a lane and a properties file that disagree
      # about the denominator produce a number nobody can check.
      #
      #   the engine   `src/bin/**`, argument plumbing over library functions
      #                the suite already drives, and the two `*_assets.rs`
      #                renderers, whose output is checked by
      #                regenerate-and-diff over committed artifacts.
      #   the console  its VIEW layer only — `app.rs`, `main.rs`, `pages.rs`,
      #                `pages/**`, `components.rs`, `components/**`,
      #                `theme.rs`. A Leptos component body executes in the
      #                BROWSER after hydration; this lane compiles the crate
      #                for `ssr` on a native target, so the instrumented
      #                binary those lines live in is never the binary that
      #                runs them, and llvm-cov cannot observe one of them.
      #                They are measured by `scripts/ui-e2e.sh` instead: a
      #                headless-Chromium journey per routed surface, each
      #                failing on any browser-console error, hydration
      #                mismatch or panic. Covered by a harness this lane
      #                cannot read, never uncovered.
      #   both suites  a suite measures the instrument, not itself.
      #
      # The console's server-fn seams, engine seam, run supervisor, export
      # renderer, redirect helper and startup state stay INSIDE the
      # denominator: they are ordinary Rust the ssr suite drives directly.
      #
      # SUB-FILE RESIDUES stay in the number rather than being hidden by a
      # whole-file exclusion (#153's closing adjudication, recorded in full
      # beside the exclusion list in `sonar-project.properties`): the
      # environment-coupled tails of `pipeline/measured.rs`,
      # `bench/baselines.rs` and `pipeline/bench.rs`, the
      # unreachable-by-construction regions listed on #193, and
      # `bench/fingerprint.rs`'s Linux-only /proc readers, which execute in
      # this lane and cannot on a macOS workstation.
      - run: cargo llvm-cov --no-report nextest --locked --workspace --features veredictum-console/ssr --profile ci
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

      # `sonar.projectVersion` anchors the "Previous version" New Code window
      # (https://docs.sonarsource.com/sonarqube-cloud/standards/about-new-code),
      # so "new code" means "since the last release" — the same window the
      # changelog section describes. The package version is the source: it bumps
      # at every release cut, which is exactly the boundary that window needs,
      # and it is read at scan time rather than copied into a second place that
      # can drift. `[package]` is the only table in the manifest carrying a
      # `version` key, and awk scopes the read to it so a future table cannot
      # shadow it. Appended to the properties file the scanner reads, so no
      # value reaches a shell argument or an action input.
      - name: Derive sonar.projectVersion from the package version
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[package\]/{p=1} p && /^version = /{print $2; exit}' app/veredictum/Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::no version found under [package] in app/veredictum/Cargo.toml"
            exit 1
          fi
          echo "sonar.projectVersion=$version" >> sonar-project.properties
          echo "projectVersion=$version"

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
