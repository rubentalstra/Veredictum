# SonarQube Cloud project scope. Advisory instrument — the standing law is
# .claude/rules/ai-code-review.md: a finding never outranks the released
# openEHR specification text, the hard rules, or the local gates, and it gates
# no merge.
sonar.projectKey=rubentalstra_Veredictum
sonar.organization=rubentalstra
sonar.projectName=Veredictum
sonar.sourceEncoding=UTF-8

# The whole tree, minus what the exclusions below carve out: the hand-written
# Rust in `src/` and `tests/`, the workflow YAML, the shell guards, the brand
# study's HTML and CSS, and secret detection over everything. Sonar has no
# analyzer for Markdown, so the prose files are inert rather than excluded.
sonar.sources=.
sonar.tests=tests

# The vendored trees. Acting on a finding inside vendored bytes is forbidden here
# — hand-editing vendored material is a hard rule, the fix is always the
# vendoring script plus a re-run — so a finding in them is noise by
# construction. Named tree by tree rather than by a wildcard, so a new vendored
# tree has to be added deliberately instead of disappearing into a pattern:
#
#   specs/openehr          the released openEHR specification text (the oracle)
#   specs/its-*-schemas    the released XSD and JSON Schema bundles
#   specs/rest-oas         the released ITS-REST OpenAPI bundles
#   artifacts/corpus       the clinical-model corpora and their fixtures
sonar.exclusions=specs/openehr/**,specs/its-xml-schemas/**,specs/its-json-schemas/**,specs/rest-oas/**,artifacts/corpus/**

# Coverage. The Sonar lane runs the suite under `cargo-llvm-cov` and imports the
# merged lcov
# (https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters).
sonar.rust.lcov.reportPaths=lcov.info

# The coverage DENOMINATOR is narrower than the analysis scope, and deliberately
# so: a percentage is only useful if every file counted could in principle be
# covered by a test.
#
#   tests/**            the suite measures the instrument, not itself
#   src/bin/**          the CLI entry point is argument plumbing over the library
#                       functions the suite already drives; counting it would
#                       reward a test that shells out instead of one that asserts
#   src/*_assets.rs     the SVG and document renderers, whose output is checked
#                       by regenerate-and-diff over committed artifacts rather
#                       than by a unit assertion
sonar.coverage.exclusions=\
  tests/**,\
  src/bin/**,\
  src/perf_assets.rs,\
  src/conf_assets.rs
