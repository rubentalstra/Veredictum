# exclusion is per-file, and the remaining uncovered regions live inside files
# whose majority IS measured, so excluding those files would discard real
# measurement to hide a residue. The residue stays visible in the number, and
# this comment plus the region lists on #192/#193 are its recorded reason:
#
#   engine, environment-coupled (the #192 class): pipeline/measured.rs past
#   seeding needs a population whose smallest scale rung is 10,000 EHRs;
#   bench/baselines.rs past a successful compose and pipeline/bench.rs's
#   with_baselines leg need a real container stack. What a container CAN
#   prove cheaply is proven in the runtime-gated env_coupled lane.
#
#   engine, unreachable by construction (the #193 list): proven-infallible
#   conversions, a debug dump gated on an env var no test may set under
#   unsafe_code=forbid, an arm the loader refuses before the runner can
#   reach it, and llvm-cov region artifacts inside #[cfg(test)] modules.
#
#   platform-gated: bench/fingerprint.rs's /proc readers execute on Linux
#   (CI) and cannot on a macOS workstation.
#
# None of these is an effort deferral: every drivable region named on the
# tracker is driven, and a new residue needs its reason added here.
