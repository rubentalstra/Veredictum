# SonarQube Cloud project scope. Advisory instrument — the standing law is
# .claude/rules/ai-code-review.md: a finding never outranks the released
# openEHR specification text, the hard rules, or the local gates, and it gates
# no merge.
sonar.projectKey=rubentalstra_Veredictum
sonar.organization=rubentalstra
sonar.projectName=Veredictum
sonar.sourceEncoding=UTF-8

# The whole tree, minus what the exclusions below carve out: the hand-written
# Rust in `src/` and `tests/`, the workflow YAML, the shell guards, the brand
# study's HTML and CSS, and secret detection over everything. Sonar has no
# analyzer for Markdown, so the prose files are inert rather than excluded.
#
# `sonar.sources=.` and `sonar.tests=app/veredictum/tests` OVERLAP, and the scanner refuses an
# overlap rather than picking a side: "File … can't be indexed twice. Please
# check that inclusion/exclusion patterns produce disjoint sets for main and
# test files", exit code 3. It fired on exactly one file —
# `tests/fixtures/defects/wire-surface-empty.yaml` — because the Rust analyzer
# claims a `.rs` file under `sonar.tests` as a test file by itself, while no
# test-capable analyzer claims the YAML fixture, so that one stayed in both
# sets. `tests/**` is therefore excluded from the MAIN sources below;
# `sonar.exclusions` applies to main sources only
# (https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope),
# so `sonar.tests` still indexes the suite as tests and nothing stops being
# analysed.
sonar.sources=.
sonar.tests=app/veredictum/tests,app/veredictum-console/tests

# The vendored trees. Acting on a finding inside vendored bytes is forbidden here
# — hand-editing vendored material is a hard rule, the fix is always the
# vendoring script plus a re-run — so a finding in them is noise by
# construction. Named tree by tree rather than by a wildcard, so a new vendored
# tree has to be added deliberately instead of disappearing into a pattern:
#
#   specs/openehr          the released openEHR specification text (the oracle)
#   specs/its-*-schemas    the released XSD and JSON Schema bundles
#   specs/rest-oas         the released ITS-REST OpenAPI bundles
#   artifacts/corpus       the clinical-model corpora and their fixtures
#
# The two `tests/**` trees are here for a different reason: they are not
# noise, they are claimed by `sonar.tests` above, and the two sets must be
# disjoint. See that comment.
sonar.exclusions=specs/openehr/**,specs/its-xml-schemas/**,specs/its-json-schemas/**,specs/rest-oas/**,artifacts/corpus/**,app/veredictum/tests/**,app/veredictum-console/tests/**

# Coverage. The Sonar lane runs the suite under `cargo-llvm-cov` and imports the
# merged lcov
# (https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters).
sonar.rust.lcov.reportPaths=lcov.info

# The coverage DENOMINATOR is narrower than the analysis scope, and deliberately
# so: a percentage is only useful if every file counted could in principle be
# covered by a test.
#
#   tests/**            the suite measures the instrument, not itself
#   src/bin/**          the CLI entry point is argument plumbing over the library
#                       functions the suite already drives; counting it would
#                       reward a test that shells out instead of one that asserts
#   src/*_assets.rs     the SVG and document renderers, whose output is checked
#                       by regenerate-and-diff over committed artifacts rather
#                       than by a unit assertion
#
# The console adds ONE class, and only that one: its VIEW layer. A Leptos
# component body executes in the browser after hydration, and the coverage
# lane compiles the crate for the `ssr` feature on a native target, so
# `cargo-llvm-cov` cannot observe a single line of it — the instrumented
# binary those lines live in is never the binary that runs them. What
# measures them instead is `scripts/ui-e2e.sh`: every routed surface is
# driven by a real headless-Chromium journey in
# `app/veredictum-console/tests/it/e2e_console.rs`, and every journey fails on
# any browser-console error, hydration mismatch or panic. So the view is
# covered by a harness this lane cannot read, never uncovered.
#
#   src/app.rs            the router and the root component
#   src/main.rs           the server entry point: mount and route plumbing over
#                         the library, the console's own `src/bin/**`
#   src/pages.rs          the surface module table and the placeholder view
#   src/pages/**          one hydrated surface per file, journey-driven
#   src/components.rs     the widget module table
#   src/components/**     the widget kit; the pure logic each file carries
#                         (pagination arithmetic, nav-key mapping) is already
#                         unit-tested inside the file, the components are not
#   src/theme.rs          `web_sys` document and localStorage calls, which have
#                         no meaning outside a browser
#
# Everything else the console carries stays measured, deliberately: the
# server-fn seams (`*_api.rs`), the engine subprocess seam, the run
# supervisor, the export renderer, the redirect helper and the startup state
# are ordinary Rust the ssr suite drives directly.
sonar.coverage.exclusions=\
  app/veredictum/tests/**,\
  app/veredictum/src/bin/**,\
  app/veredictum/src/perf_assets.rs,\
  app/veredictum/src/conf_assets.rs,\
  app/veredictum-console/tests/**,\
  app/veredictum-console/src/app.rs,\
  app/veredictum-console/src/main.rs,\
  app/veredictum-console/src/pages.rs,\
  app/veredictum-console/src/pages/**,\
  app/veredictum-console/src/components.rs,\
  app/veredictum-console/src/components/**,\
  app/veredictum-console/src/theme.rs

