# SonarQube Cloud project scope. Advisory instrument — the standing law is
# .claude/rules/ai-code-review.md: a finding never outranks the released
# openEHR specification text, the hard rules, or the local gates, and it gates
# no merge.
sonar.projectKey=rubentalstra_Veredictum
sonar.organization=rubentalstra
sonar.projectName=Veredictum
sonar.sourceEncoding=UTF-8

# The WHOLE tree, deliberately. There is no first-party source code here yet, so
# what the analyzer has to read today is the workflow YAML, the shell guards,
# the brand study's HTML and CSS, and secret detection over everything — and
# narrowing the scope of a scan that has little to scan would only flatter the
# numbers. Sonar has no analyzer for Markdown, so the prose files are inert
# rather than excluded.
sonar.sources=.

# NOT DECLARED YET, on purpose. Two exclusion families arrive with the code
# migration (https://github.com/rubentalstra/FerroEHR/issues/2789), each in the
# pull request that brings the tree it names:
#
#   * the vendored trees — the openEHR specification text, the machine-readable
#     artifacts, the clinical-model corpora. Acting on a finding inside vendored
#     bytes is forbidden here (hand-editing vendored material is a hard rule),
#     so reporting on them is noise by construction.
#   * anything a generator owns, once anything is generated.
#
# Coverage is likewise absent because there is no test suite to measure. When
# the runner lands, its instrumented run imports its lcov through
# `sonar.rust.lcov.reportPaths`, and the coverage denominator excludes the trees
# no unit test can execute.
#
# A `sonar.exclusions` line naming a path that does not exist would be a scope
# claim about nothing, so none is written in advance.
