<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="Veredictum icon">
  <!-- Veredictum primary icon: a verdict seal. The circular stamp is the mark
     an assayer strikes after testing; the V doubles as the checkmark the
     instrument's verdicts stand for. Carries its own ground, so it works on
     light and dark. Palette: Tyrian & Parchment (tokens.css). -->
  <circle cx="32" cy="32" r="30" fill="#46215C"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#F4EDE1" stroke-width="1.4" opacity="0.5"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#D8B04A" stroke-width="1.2" stroke-dasharray="1.6 2.4" opacity="0.85"/>
  <path d="M18.5 27 L29 45.5 L46.5 17.5" fill="none" stroke="#F4EDE1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18.5 27 L29 45.5 L46.5 17.5" fill="none" stroke="#D8B04A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
</svg>
