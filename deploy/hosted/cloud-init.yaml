#cloud-config
# console.veredictum.eu, from a fresh Hetzner box to serving state on first boot
# (#412).
#
# Committed rather than remembered. A host built by hand is a host nobody can
# rebuild, and the first time it needs rebuilding is the worst time to discover
# that. Pass this as the server's user data at creation; #403 is the owner
# action that does.
#
# What it deliberately does NOT do: fetch anything from this repository. The box
# holds no checkout. Everything the instrument needs is baked into the image
# (docker/Dockerfile, #420), so the deploy is a pull.

users:
  - name: deploy
    lock_passwd: true
    shell: /bin/bash
    # No `groups: [docker]` here: users are created before Docker is installed,
    # so the group does not exist yet — cloud-init warns, moves on, and leaves
    # this user unable to reach the socket. runcmd joins it after the install.
    #
    # Both keys are REAL, and that is deliberate: a public key is not a secret —
    # GitHub publishes every account's at `github.com/<user>.keys` — and a
    # cloud-init carrying placeholders cannot rebuild the box, which is the one
    # thing this file exists to do.
    ssh_authorized_keys:
      # A person, for logging in and looking around.
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGFOMcuGIZKPwC0aHkleBo7MNO1jEz3wyNSUKTNpQSBJ RubenTalstra1211@outlook.com
      # CI, restricted to one command: SSH runs the deploy script whatever the
      # client asks for, so a leaked key runs one script rather than a shell.
      # Its private half exists only as HOSTED_SSH_KEY in the `hosted`
      # environment.
      - command="/opt/veredictum-console/deploy.sh",no-agent-forwarding,no-port-forwarding,no-user-rc,no-pty ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGc2TtLLov6GBGjR0e/bMbwSHDhfBE93mqwq8YBv/F5W deploy@ci

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - ufw
  - unattended-upgrades

write_files:
  # A box nobody logs into still takes security updates.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # Container logs are the likeliest thing to fill a small disk, and a full disk
  # fails in a way that looks like nothing at all.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }

  # The ONE command the CI key may run. The deploy is a pull and a recreate:
  # nothing is built here, and nothing is fetched from this repository.
  - path: /opt/veredictum-console/deploy.sh
    permissions: "0755"
    owner: deploy:deploy
    # Deferred to the final stage: `write-files` runs BEFORE `users-groups` in
    # the default module order, so an owner naming this user cannot be applied
    # any earlier.
    defer: true
    content: |
      #!/usr/bin/env bash
      # SSH runs this whatever the client asked for, which is the point of the
      # command= restriction on the key.
      set -euo pipefail
      cd /opt/veredictum-console
      docker compose pull -q
      docker compose up -d --remove-orphans
      # Images the instrument no longer runs. A running container's image is
      # never pruned, so this cannot take the release out from under itself.
      docker image prune -f --filter "until=168h"

runcmd:
  # Two firewalls that agree. The Hetzner Cloud Firewall keeps traffic off the
  # NIC; this is what the box itself says, and a disagreement between them is a
  # question worth answering.
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, allow, "80/tcp"]
  - [ufw, allow, "443/tcp"]
  - [ufw, --force, enable]
  - [sh, -c, "curl -fsSL https://get.docker.com | sh"]
  - [systemctl, enable, --now, docker]
  - [install, -d, -o, deploy, -g, deploy, /opt/veredictum-console]
  # The group exists now, so the deploy user can join it. A group change takes
  # effect at the next login, and every deploy is its own SSH session.
  - [usermod, -aG, docker, deploy]
  - [systemctl, enable, --now, unattended-upgrades]

final_message: >-
  the box is up after $UPTIME seconds. Put docker-compose.yml, Caddyfile and
  .env in /opt/veredictum-console, then run the deploy lane.
