# What runs on the box: the instrument, and a proxy that gets its own
# certificate (#412).
#
# The file lives at /opt/veredictum-console/docker-compose.yml on the host. CI
# never edits it — the deploy is a pull and a recreate — so a change here is a
# change someone makes deliberately.

services:
  console:
    # The release pointer scan-and-tag moves on a real release tag. One image
    # (#420): it carries the engine, the console and the release's own
    # catalogue, oracle and party declarations, so this instance mounts nothing.
    # `.env` names the exact reference so a rollback can move it.
    image: ${CONSOLE_IMAGE:-ghcr.io/rubentalstra/veredictum:latest}
    container_name: veredictum-console
    # A conformance run is a process that outlives its request. A crash must
    # come back, because nothing else is watching from inside the box.
    restart: unless-stopped
    # The image is its own health probe (`veredictum-console healthcheck`),
    # because the distroless base carries no shell and no curl. The deploy waits
    # on this before it verifies anything from outside.
    healthcheck:
      test: ["CMD", "/usr/local/bin/veredictum-console", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sized for the box, not for an aspiration. The instrument runs on a CPX12
    # today — 1 vCPU, 2 GB — so this leaves roughly 700 MB for Caddy and the
    # operating system. The limit exists so a runaway run cannot take the proxy
    # and the host with it.
    #
    # ON A RESIZE, both of these move together and neither is a code change:
    # this number, and VEREDICTUM_MAX_CONCURRENT_RUNS in `.env`. A limit above
    # what the host has is not a limit — the host runs out first, and what it
    # kills is whichever process asks next.
    deploy:
      resources:
        limits:
          memory: 1200m
    environment:
      # The public posture: a visitor names the endpoint, so private,
      # link-local and loopback targets are refused before a socket opens.
      VEREDICTUM_POSTURE: hosted
      # Behind Caddy the peer address is Caddy, so the per-submitter caps read
      # the address Caddy forwards — and only because this names the header.
      VEREDICTUM_CLIENT_IP_HEADER: X-Forwarded-For
      # What this host can actually drive at once. #388 reasoned two on an 8 GB
      # machine and called it a value to re-derive by measuring; a 2 GB box
      # drives one, and the queue covers the difference with a position rather
      # than a refusal. Raise it with the memory limit above when the box grows.
      VEREDICTUM_MAX_CONCURRENT_RUNS: "${VEREDICTUM_MAX_CONCURRENT_RUNS:-1}"
    env_file:
      # Holds CONSOLE_IMAGE and the GitHub App's id, installation and repository.
      # Readable by the service user alone.
      - .env
    # The App's private key, the one credential on this host. It arrives as a
    # file rather than an environment value because the console opens it by
    # path, and `VEREDICTUM_GITHUB_APP_KEY` in `.env` names the mount below.
    # Compose applies `uid`, `gid` and `mode` only to a secret sourced from an
    # environment variable (https://docs.docker.com/reference/compose-file/services/),
    # so a file-sourced secret keeps the HOST file's ownership: the key on the
    # box is owned by 65532 mode 400, which is the console's own uid and nobody
    # else's. A missing file fails the recreate loudly instead of mounting a
    # directory over the path.
    secrets:
      - github-app.pem
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: veredictum-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and the account key survive a redeploy. Losing them
      # means asking for a new certificate on every deploy, which is how a
      # deploy loop meets a rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - console

volumes:
  caddy_data:
  caddy_config:

secrets:
  github-app.pem:
    file: ./github-app.pem
