#
# console.veredictum.eu — the official conformance instrument (#388, #394).
#
# WHY A MACHINE THAT NEVER STOPS. A conformance run is a process that outlives
# the request that started it: the console spawns the pinned engine, streams
# its output for minutes, and writes the record to the container's own
# filesystem. An autoscaling request platform breaks all three — several
# instances answer one service, so a poll can reach one that never held the
# run, and an instance with no traffic for five minutes is terminated, engine
# child included. #387 recorded that failure live. So autostop is off and one
# machine is always running, sized for the concurrency cap in #388.
#
# NOTHING HERE IS DURABLE, deliberately. No volume is attached: a run's
# artifacts live long enough to be judged, shown and submitted, and git is
# where a record lives. A redeploy ends the runs in flight and costs no
# published record.
#
# NO SIGNING KEY REACHES THIS HOST, in any form. A console record is signed by
# the registry key, which exists only in the `registry-signing` CI environment
# (`registry/keys/README.md`).

# The image is named on the deploy command line rather than in a `[build]`
# block: the overlay COPYs `artifacts/`, `specs/openehr/` and `party/`, so the
# build context has to be the repository root while this file lives beside the
# Dockerfile, and one spelling of that pair beats two that can disagree.
app = "veredictum-console"
primary_region = "ams"

[http_service]
  internal_port = 3000
  force_https = true
  # The instrument is never asleep: a visitor who closes the tab for ten
  # minutes must still find their run when they come back.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # Well above anything the caps admit: the limit that matters is the
    # concurrent-run cap the console enforces itself, and a request limit here
    # would only queue the live screen's polling.
    soft_limit = 200
    hard_limit = 400

  [http_service.checks]
    # The console answers /healthz outside its own route tree, so a broken
    # bundle or a broken shell still reports honestly on whether the server
    # accepts connections.
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  # Each run is an engine process that loads the whole catalogue, and the cap
  # is two at once plus the console itself. Memory is the ceiling, so it is
  # the number to re-derive by measuring rather than the one to trust.
  size = "shared-cpu-2x"
  memory = "2gb"
