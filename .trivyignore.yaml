# Adjudicated Trivy exceptions. Each entry carries its CVE, the evidence for the
# adjudication, and an EXPIRY DATE, so an exception cannot become permanent by
# inattention: past the date Trivy reports the finding again and it has to be
# re-argued or removed.
#
# The standing rule is that a finding we can FIX is fixed, never suppressed. An
# entry here has to establish that the vulnerable code cannot be reached in this
# image, and it is scoped to one CVE and one path — never a severity floor, never
# a whole package, never a blanket rule.
vulnerabilities:
  - id: CVE-2026-14456
    # `libssl3t64` in the distroless base, HIGH, Debian has a fix
    # (3.5.7-1~deb13u2) that the base image has not yet been rebuilt against —
    # verified 2026-08-26 by scanning the CURRENT `:nonroot` digest
    # (sha256:a77defd6…), which still carries 3.5.6-1~deb13u2. So a base bump
    # does not resolve it, and a distroless image has no package manager to
    # upgrade it in a layer of our own.
    #
    # THE EVIDENCE that it is unreachable, and it is not an argument from
    # design — it is the shipped binary's own ELF header, read 2026-08-26:
    #
    #   $ readelf -d target/release/veredictum | grep NEEDED
    #     NEEDED  Shared library: [libgcc_s.so.1]
    #     NEEDED  Shared library: [libm.so.6]
    #     NEEDED  Shared library: [libc.so.6]
    #
    # No `libssl.so`, no `libcrypto.so`. TLS is rustls
    # (`reqwest` with `default-features = false`) and the JOSE signing is
    # `aws_lc_rs`, so OpenSSL is linked by nothing this project builds. The
    # image is distroless: there is no shell, no package manager and no second
    # executable, and the entrypoint is that binary — so there is nothing else
    # in the image that could load the library either.
    #
    # Scoped by PURL to this ONE package, so a finding in a different component
    # still fails the gate.
    #
    # Two things about the scoping were measured rather than assumed, because
    # both failure modes are silent — an entry that matches nothing looks exactly
    # like a control that is working:
    #
    #   * NOT `paths`. An OS-package finding carries no `PkgPath` (the JSON
    #     reports `"PkgPath": null`), so a path filter can never match one.
    #   * The purl is written WITHOUT a version. The observed purl is
    #     `pkg:deb/debian/libssl3t64@3.5.6-1~deb13u2?arch=amd64&distro=debian-13.6`
    #     and, on Trivy 0.73.0, neither that exact string nor
    #     `pkg:deb/debian/libssl3t64@*` matches it — only the version-less form
    #     does. That is also the form that should be here on its own merits: the
    #     version and the `arch`/`distro` qualifiers differ per platform and
    #     change on every base rebuild.
    purls:
      - "pkg:deb/debian/libssl3t64"
    statement: >-
      Not affected: no executable in this image links OpenSSL. The shipped
      binary's ELF NEEDED list is libgcc_s, libm and libc only; TLS is rustls
      and the JOSE signing is aws-lc-rs. The image is distroless, so it carries
      no shell, no package manager and no other program that could load the
      library.
    expired_at: 2026-11-26
